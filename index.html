<!DOCTYPE html>
<html lang="ja" class="is-locked">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- viewport-fit=cover：ノッチ・ホームバーの裏（画面の端まで）に表示を広げる -->
  <meta name="color-scheme" content="dark light">

  <!-- リロード・戻る操作でも、前回のスクロール位置を復元せず、必ず最上部から始める -->
  <script>if ("scrollRestoration" in history) history.scrollRestoration = "manual";</script>

  <!-- ★ヒーロー画像を最優先で読み込む（Preload）。画像の拡張子が .jpg 以外のときは、下の href と
       <img id="heroImg"> の src を合わせて変更してください（無い場合は自動で別の拡張子を探し、それも無ければ画像なし＝グレーの背景になります） -->
  <link rel="preload" as="image" href="images/hero.jpg" fetchpriority="high">
  <title>第64回 文化祭｜伝承華</title>

  <!-- Google Fonts：明朝体（Noto Serif JP） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;900&display=swap" rel="stylesheet">
  <!-- 「Denshōka」の ō（マクロン）専用：日本語フォントの ō は線の位置がずれることがあるため、この1文字だけ欧文フォントで表示する -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@300;400&text=%C5%8D&display=swap" rel="stylesheet">

  <style>
    /* ==================================================
       配色（ダーク／ライト）
       ★色を変えたいときはここの変数だけ編集すればOKです。
       OSのテーマ設定に自動で追従します（JavaScriptが <html data-theme="..."> を切り替え）。
    ================================================== */
    :root {
      color-scheme: dark light;
      /* ▼ ダークモード（初期値） */
      --ink: #15131a;          /* ページ背景 */
      --ink-soft: #1f1c27;     /* モーダルなどの背景 */
      --sakura: #e8a6b6;       /* アクセント色（桜） */
      --text: #ffffff;         /* 文字色 */
      --line: rgba(255, 255, 255, 0.5);       /* ボタンの枠線 */
      --card-border: rgba(255, 255, 255, 0.14); /* カードの枠線 */
      --card-w: 260px;           /* カードの幅（カルーセルはJSが画面幅から自動計算します） */
      --gap: 16px;               /* カード同士のすき間（スマホは下のmediaで10px） */
      --pad: clamp(1rem, 4vw, 3rem);          /* 左端の余白 */
    }

    /* ▼ ライトモード（JSで data-theme="light" が付いたとき） */
    :root[data-theme="light"] {
      color-scheme: light;
      --ink: #faf7f4;
      --ink-soft: #ffffff;
      --sakura: #b4415c;
      --text: #1d1a20;
      --line: rgba(0, 0, 0, 0.35);
      --card-border: rgba(0, 0, 0, 0.14);
    }
    /* ▼ JSが動く前の保険（OS設定がライトのとき）。上と同じ値にしてください */
    @media (prefers-color-scheme: light) {
      :root:not([data-theme]) {
        color-scheme: light;
        --ink: #faf7f4; --ink-soft: #ffffff; --sakura: #b4415c;
        --text: #1d1a20; --line: rgba(0, 0, 0, 0.35); --card-border: rgba(0, 0, 0, 0.14);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ★横スクロール（横揺れ）防止：画面幅を超えた部分は切り取る */
    html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }
    .hero, .categories, .category { max-width: 100%; overflow-x: hidden; }

    html { scroll-behavior: smooth; }

    body {
      font-family: "Noto Serif JP", "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
      background: var(--ink);
      color: var(--text);
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* スクロールを止める場合：
       ・is-locked   … ページを開いてから、タイトル表示 → 見出しボックス群の読み込みが完了するまで
       ・modal-open  … ポップアップ（モーダル）表示中 */
    html.is-locked, html.is-locked body,
    html.modal-open, html.modal-open body { overflow: hidden; }

    /* ==================================================
       1. ヒーローセクション
    ================================================== */
    .hero {
      position: relative;
      width: 100%;          /* 100vw だと縦スクロールバーの幅ぶんはみ出して横スクロールが出るため 100% にしています */
      /* 初回表示でヒーローだけが画面ぴったりに収まるようにする（アドレスバー・アプリ内ブラウザ対策）
         ① 100vh：古いブラウザ用  ② --app-h：JSで測った実際に見える高さ（LINE/Instagram等のアプリ内ブラウザ用）
         ③ 100svh：アドレスバーが出ている状態の高さ。アドレスバーの出入りでヒーローの大きさが
            変わらないので、画像のチラつきを防げます（dvh を使うとスクロール中に大きさが変わるため svh を採用） */
      /* ★ヒーロー（背景画像）は「いちばん大きい画面の高さ（100lvh）」にして、ブラウザの下のボタン・アドレスバーの
         奥（画面の最下部）まで隙間なく敷く。lvh は固定なので、バーの出入りで大きさが変わらずチラつかない。
         ・古いブラウザ：100vh → --app-h（JSで測った高さ）の順に代わりを使う
         ・文字（タイトル・サブタイトル・Scroll）は、バーに隠れないよう「実際に見える高さ(--vis-h)」の範囲に配置する */
      --vis-h: var(--app-h, 100vh);
      height: 100vh;
      height: var(--app-h, 100vh);
      height: 100lvh;
      overflow: hidden;
      contain: paint;                    /* ヒーローの再描画を内側に閉じ込めて、チラつきを減らす */
      background: #4a4a4a;   /* 背景画像が無いときのグレーの背景（空欄） */
    }
    @supports (height: 100lvh) { .hero { --vis-h: 100svh; } }   /* 見える高さ＝バーが出ている状態の高さ */

    /* ★背景画像：HTML内の <img class="hero__bg"> の src を差し替え */
    .hero__bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;         /* 縦長の画面（スマホ縦）は画面いっぱいに表示 */
      object-position: center;
      transform: translateZ(0);          /* GPUで描画してチラつきを防ぐ */
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    /* 横長の画面（PC・スマホ横向き）：
       ① メイン画像は切り取らず、元の縦長のまま中央に表示（contain）
       ② 左右の空いたところには、同じ画像をぼかして拡大した背景（.hero__bg-blur）を敷く */
    .hero__bg-blur {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: blur(28px) brightness(0.85);   /* ぼかしの強さ・明るさはここで調整 */
      transform: scale(1.15) translateZ(0);  /* ぼかした縁が見えないよう少し拡大（GPU描画） */
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
    @media (min-aspect-ratio: 1 / 1) {
      .hero__bg { object-fit: contain; }
      .hero__bg-blur { display: block; }
    }

    .hero__content {
      position: absolute;
      inset: 0 0 auto 0;
      height: var(--vis-h, 100%);        /* タイトルは「見える範囲」の中央に置く */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ① 縦書きメインタイトル */
    .title-vertical {
      writing-mode: vertical-rl;
      color: #fff;
      font-weight: 300;
      letter-spacing: 0.3em;
      line-height: 1.8;
      white-space: nowrap;             /* 勝手に折り返さない（改行はHTML内で指定した位置だけ） */
      padding: min(2.5rem, 4vh) min(1.8rem, 3vw);
      transform: translateZ(0);          /* GPUで描画してチラつきを防ぐ */
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      will-change: opacity;
      /* 背景ではなく影で文字を際立たせる（濃さ・広がりはここで調整） */
      text-shadow:
        0 0 4px rgba(0, 0, 0, 0.9),
        2px 2px 4px #000,
        -2px 2px 4px #000,
        0 0 12px rgba(0, 0, 0, 0.8),
        0 0 28px rgba(0, 0, 0, 0.6);
      opacity: 0;
    }
    /* 文字サイズは画面の幅(vw)と高さ(vh)の小さい方に合わせて自動で拡大・縮小します。
       clamp(最小, 可変, 最大)：数字を変えると大きさを調整できます */
    .title-vertical__main { display: block; white-space: nowrap; font-size: clamp(1.8rem, min(12vw, 12vh), 5.5rem); font-weight: 300; }
    .title-vertical__sub  { display: block; white-space: nowrap; font-size: clamp(0.65rem, min(5vw, 4.4vh), 1.6rem); font-weight: 200; }

    /* ② 横書きサブタイトル（画面左下） */
    .title-horizontal {
      position: absolute;
      left: clamp(1rem, 3vw, 3rem);
      bottom: calc(100% - var(--vis-h, 100%) + clamp(1rem, 4vh, 2.5rem) + env(safe-area-inset-bottom, 0px));   /* 見える範囲の下端から */
      color: #fff;
      font-weight: 900;
      font-size: clamp(0.9rem, min(4.2vw, 5vh), 1.8rem);   /* 画面に合わせて自動調整 */
      line-height: 1.3;
      letter-spacing: 0.08em;
      white-space: nowrap;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;       /* GPUで描画してチラつきを防ぐ */
      will-change: transform, opacity;
      -webkit-text-stroke: 1px #000;
      paint-order: stroke fill;
      text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000,
                   0 2px 8px rgba(0, 0, 0, 0.5);
      opacity: 0;
    }

    /* 「Scroll ↓」案内（演出完了後に表示） */
    .scroll-hint {
      position: absolute;
      left: 50%;
      bottom: calc(100% - var(--vis-h, 100%) + clamp(1rem, 4vh, 2.5rem) + env(safe-area-inset-bottom, 0px));
      transform: translate3d(-50%, 0, 0);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.1rem;
      padding: 0.5rem 1.6rem 0.4rem;
      border: 2px solid rgba(255, 255, 255, 0.85);   /* 白い枠 */
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.45);               /* 写真の上でも読めるよう、濃い半透明の丸い帯 */
      cursor: pointer;
      color: #fff;
      font-family: inherit;
      font-weight: 400;
      font-size: clamp(1.4rem, 5vw, 2rem);           /* 以前（1rem）の約1.4〜2倍の大きさ */
      letter-spacing: 0.25em;
      text-indent: 0.25em;                           /* 文字間の右端ぶんをそろえて、中央に見えるように */
      line-height: 1.2;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 2px 4px rgba(0, 0, 0, 0.9);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }
    .scroll-hint.is-visible { opacity: 1; pointer-events: auto; }
    .scroll-hint span { display: block; font-size: 1.4em; line-height: 1; animation: bob 1.6s ease-in-out infinite; }   /* ↓ を大きく、上下に動かす */

    /* アニメーションの流れ
       ① 背景画像の読み込み完了 → 縦書きタイトルが 1.1秒でフェードイン（0.2秒後に開始）
       ② 縦書きの表示が完了した瞬間（JSが .is-title-done を付ける）に、横書きサブタイトルが左からスライドイン。
          同時に、下の見出しボックス群の読み込みを始め、完了したら「Scroll」案内を表示してスクロールを解禁する */
    .is-loaded .title-vertical        { animation: fadeIn 1.1s ease-out 0.2s forwards; }
    .is-title-done .title-horizontal  { animation: slideInFromLeft 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideInFromLeft {
      from { opacity: 0; transform: translateX(-150%); }  /* 画面の左外から（上下は動かない） */
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }

    /* ==================================================
       2. カテゴリ別カルーセル
    ================================================== */
    .categories {
      padding: clamp(3rem, 8vw, 6rem) 0 clamp(3rem, 8vw, 6rem);
    }

    .category { margin-bottom: clamp(2.5rem, 6vw, 4.5rem); }
    .category:last-child { margin-bottom: 0; }

    .category__head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      padding: 0 max(clamp(1rem, 4vw, 3rem), env(safe-area-inset-right, 0px)) 0 max(clamp(1rem, 4vw, 3rem), env(safe-area-inset-left, 0px));
      margin-bottom: 1rem;
    }
    .category__title {
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 400;
      letter-spacing: 0.12em;
      padding-left: 0.8rem;
      border-left: 3px solid var(--sakura);
    }
    .all-btn {
      background: none;
      border: 0;
      color: var(--sakura);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      cursor: pointer;
      white-space: nowrap;
      padding: 0.3rem 0;
      border-bottom: 1px solid transparent;
    }
    .all-btn:hover, .all-btn:focus-visible { border-bottom-color: var(--sakura); outline: none; }

    .carousel { position: relative; overflow: hidden; }

    /* 表示窓（横ドラッグは自前処理、縦スクロールはブラウザに任せる） */
    .carousel__viewport {
      overflow: hidden;
      touch-action: pan-y;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    .carousel__viewport.is-dragging { cursor: grabbing; }

    /* カードの並び（JavaScriptが transform で動かします） */
    .carousel__track {
      display: flex;
      gap: var(--gap);
      width: max-content;
      /* 左の余白は、中央のカードが真ん中に来るようJavaScriptが自動で設定します */
      will-change: transform;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    /* カード（ボックス） */
    .card {
      flex: 0 0 var(--card-w);
      margin: 0;
    }
    /* ▼ 画像の枠と比率が違うとき：画像は切らずに全体を表示し、余った上下／左右には
         同じ画像を「ぼかして拡大」した背景を敷く。背景の画像URL(--bg)は、画像の読み込み完了時にJSが設定します */
    .blurbg { position: relative; overflow: hidden; }
    .blurbg::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--bg) center / cover no-repeat;
      filter: blur(14px);                /* ぼかしの強さ */
      transform: scale(1.3) translateZ(0);   /* ぼかした縁が見えないよう拡大（GPUで描画してチラつきを防ぐ） */
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    /* 画像の枠（団体名は画像に重ねず、この下に表示します） */
    .card__img {
      position: relative;
      aspect-ratio: 297 / 210;      /* A4横向き（297:210 ≒ 1.414:1）に固定。すべてのカード共通 */
      border: 1px solid var(--card-border);
      border-radius: 6px;
      overflow: hidden;
      background: #333;
    }
    .card__img img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;              /* 画像は切らずに全体を表示（余白はぼかし背景で埋める） */
      object-position: center;
      max-width: 100%;
      pointer-events: none;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      opacity: 0;                       /* 読み込み完了まで非表示 → ふわっと表示（チラつき防止） */
      transition: opacity 0.35s ease;
    }
    .card__img img.is-ready { opacity: 1; }
    .nb { display: inline-block; white-space: nowrap; }   /* この中では折り返さない */
    .namewrap.is-wrapped .nb { display: block; line-height: 1.15; }   /* 2段になるとき：「普通科美術部」「・」「美術選択者」を1行ずつに。行間を詰める（数字を小さくするともっと詰まる） */
    .namewrap.is-wrapped .sep { line-height: 0.85; }                 /* 真ん中の「・」はさらに詰める */
    .namewrap.is-wrapped wbr { display: none; }                      /* ブロックの間にある wbr が余計な空行を作るのを防ぐ */
    /* 団体名・クラス名（画像の下）。色はダーク/ライトモードに自動で合わせます */
    .card__name {
      margin-top: 0.6rem;
      text-align: center;
      color: var(--text);
      font-weight: 300;
      font-size: clamp(1rem, 1.8vw, 1.3rem);
      letter-spacing: 0.1em;
      line-height: 1.5;
    }

    /* 左右ボタン */
    .carousel__btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      width: 2.8rem;
      height: 2.8rem;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-family: inherit;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .carousel__btn:hover, .carousel__btn:focus-visible { background: rgba(232, 166, 182, 0.85); outline: none; }
    .carousel__btn:disabled, .carousel__btn:disabled:hover { opacity: 0.3; cursor: default; background: rgba(0, 0, 0, 0.55); }
    /* 矢印ボタンは「画像」の高さの中央に置く（団体名の分は含めない） */
    .carousel .carousel__btn { top: calc(var(--card-w) * 0.3535); }   /* 画像の高さ(幅×210/297)の半分 */
    .carousel__btn--prev { left: clamp(0.4rem, 1.5vw, 1.2rem); }
    .carousel__btn--next { right: clamp(0.4rem, 1.5vw, 1.2rem); }

    /* ==================================================
       3. 「すべて表示」モーダル
    ================================================== */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.75);
    }
    .modal.is-open { display: flex; }
    .modal__panel {
      width: min(960px, 100%);
      max-height: 88vh;
      overflow-y: auto;
      background: var(--ink-soft);
      border-radius: 10px;
      padding: clamp(1.2rem, 3vw, 2rem);
    }
    .modal__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.2rem;
    }
    .modal__title {
      font-size: clamp(1.3rem, 3vw, 1.8rem);
      font-weight: 400;
      letter-spacing: 0.12em;
      padding-left: 0.8rem;
      border-left: 3px solid var(--sakura);
    }
    .modal__close {
      background: none;
      border: 1px solid var(--line);
      border-radius: 50%;
      width: 2.4rem;
      height: 2.4rem;
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
    }
    .modal__close:hover, .modal__close:focus-visible { background: rgba(128, 128, 128, 0.25); outline: none; }
    .modal__grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.8rem;
    }
    .modal__grid .card { flex: none; }
    /* 一覧のグループ見出し（体育館(ステージ)／中庭 など）。グリッド全幅を使う */
    .modal__group {
      grid-column: 1 / -1;
      margin-top: 0.8rem;
      padding-left: 0.6rem;
      border-left: 3px solid var(--sakura);
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      line-height: 1.4;
    }
    .modal__group:first-child { margin-top: 0; }

    /* スマホ表示（JS側の MOBILE_MAX_WIDTH と同じ値にしてください） */
    /* ==================================================
       団体の詳細ポップアップ
    ================================================== */
    .card { cursor: pointer; }
    .carousel__viewport .card { cursor: inherit; }   /* カルーセル内はドラッグ用の手のカーソル */
    .modal--detail { z-index: 110; }                  /* 一覧モーダルより手前に出す */
    .detail__panel { width: min(760px, 100%); }
    .detail__sub {
      margin: -0.4rem 0 0 calc(3px + 0.8rem);
      color: var(--sakura);
      font-size: 1rem;
      letter-spacing: 0.06em;
      line-height: 1.6;
    }
    .detail__text {
      margin-top: 1.4rem;
      font-size: 1.05rem;
      line-height: 2;
      letter-spacing: 0.04em;
      font-weight: 400;
    }
    /* 詳細ポップアップの画像：元の画像をそのまま表示（ぼかし・切り取りなし）。
       枠は画像の大きさに合わせて変わる。幅はポップアップいっぱいまで、高さは画面の70%まで */
    .detail__box { margin-top: 1.6rem; text-align: center; }
    .detail__img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 70vh;
      margin: 0 auto;
      border: 1px solid var(--card-border);
      border-radius: 6px;
    }
    .detail__img:not([src]) { display: none; }   /* 読み込み前は表示しない */

    @media (max-width: 767px) {
      :root { --gap: 10px; }
      /* 「＜すべて表示＞」の一覧：スマホでは2列で表示 */
      .modal__grid { grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
      .modal__grid .card__name { font-size: 0.95rem; letter-spacing: 0.05em; }
    }

    /* ==================================================
       フッター
    ================================================== */
    .footer {
      border-top: 1px solid var(--card-border);
      background: var(--ink-soft);
      padding: clamp(2rem, 6vw, 3.5rem) max(var(--pad), env(safe-area-inset-right, 0px)) calc(clamp(1.5rem, 4vw, 2.5rem) + 3.5rem + env(safe-area-inset-bottom, 0px)) max(var(--pad), env(safe-area-inset-left, 0px));   /* 下に余白＝右下の地球ボタンと重ならないように */
    }
    .footer__inner { max-width: 1100px; margin: 0 auto; }
    /* 校章は学校名などの文字の上・中央。文字情報はすべて中央揃え */
    .footer__school {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(0.8rem, 2vw, 1.2rem);
      text-align: center;
    }
    .footer__emblem {
      flex: none;
      width: clamp(64px, 10vw, 88px);
      aspect-ratio: 1 / 1;
      object-fit: contain;               /* 校章は歪めず全体を表示 */
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .footer__emblem.is-ready { opacity: 1; }
    .footer__info { font-size: 0.95rem; line-height: 1.9; letter-spacing: 0.04em; text-align: center; }
    .footer__info a { color: inherit; }
    .footer__name { font-size: clamp(1.15rem, 2.4vw, 1.45rem); letter-spacing: 0.1em; line-height: 1.5; }
    .footer__name span { display: block; font-size: 0.8rem; letter-spacing: 0.04em; opacity: 0.8; }
    .footer__admin { margin-top: 0.4rem; font-size: 0.85rem; opacity: 0.85; }

    /* リンクバナー：PC=横並び／スマホ=縦並び。
       高さは --banner-h にそろえ、横幅は各バナー画像の縦横比に合わせて自動で決まる（余白・ぼかしなし） */
    .footer__banners {
      --banner-h: 46px;                  /* バナーの高さ。大きさを変えたいときはここ */
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.8rem;
      margin-top: clamp(1.8rem, 5vw, 2.8rem);
    }
    .footer__banners li { min-width: 0; max-width: 100%; }
    .footer__banners a {
      display: block;
      line-height: 0;                    /* 画像のまわりに余白が出ないようにする */
      border-radius: 0;                  /* 角は丸くしない（完全な長方形） */
      transition: outline-color 0.2s;
      outline: 2px solid transparent;
      outline-offset: 2px;
    }
    .footer__banners a:hover, .footer__banners a:focus-visible { outline-color: var(--sakura); }
    /* バナー画像が無いときは、グレーの空枠（リンクは使える） */
    .footer__banners a.is-empty { width: 200px; height: var(--banner-h); max-width: 100%; background: rgba(128, 128, 128, 0.3); }
    .footer__banners a.is-empty img { display: none; }
    .footer__banners img {
      display: block;
      height: var(--banner-h);
      width: auto;                       /* 横幅は画像の比率から自動 */
      max-width: 100%;
      aspect-ratio: auto 200 / 46;       /* "auto" を付けると、読み込み後は画像本来の比率が優先される（読み込み前だけ仮の枠 200:46） */
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .footer__banners img.is-ready { opacity: 1; }
    @media (max-width: 767px) {
      .footer__banners { flex-direction: column; }   /* スマホは縦並び */
    }

    /* ==================================================
       言語切り替え（右下に固定の地球ボタン）
       ・ボタンは指で押しやすい44px。端から12px＋ホームバー等の安全領域ぶん離す
       ・z-index 200：ポップアップ（100/110）より手前＝いつでも押せる
    ================================================== */
    .lang {
      position: fixed;
      right: calc(12px + env(safe-area-inset-right, 0px));
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    .lang__btn {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      padding: 0;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.65);
      background: rgba(0, 0, 0, 0.62);   /* 写真の上でも見えるよう、濃い半透明の丸 */
      color: #fff;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }
    .lang__btn:hover, .lang__btn:focus-visible, .lang__btn[aria-expanded="true"] { background: rgba(0, 0, 0, 0.85); border-color: var(--sakura); outline: none; }
    .lang__menu {
      list-style: none;
      min-width: 150px;
      padding: 4px;
      background: var(--ink-soft);
      color: var(--text);
      border: 1px solid var(--card-border);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }
    .lang__menu button {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0.75rem 1rem;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      letter-spacing: 0.06em;
      text-align: left;
      cursor: pointer;
    }
    .lang__menu button:hover, .lang__menu button:focus-visible { background: rgba(128, 128, 128, 0.2); outline: none; }
    .lang__menu button[aria-checked="true"]::after { content: "✓"; margin-left: 1rem; color: var(--sakura); }

    /* English表示のとき：縦書きタイトルは英語が読みにくいので、横書きに切り替える */
    .macron { font-family: "Noto Serif", "Times New Roman", Times, serif; letter-spacing: 0; }   /* ō だけ欧文フォントで、線を正しい位置に */
    html[lang="en"] .title-vertical { writing-mode: horizontal-tb; text-align: center; letter-spacing: 0.06em; }
    html[lang="en"] .title-vertical__main { font-size: clamp(2rem, min(11vw, 12vh), 4.8rem); letter-spacing: 0.1em; }
    html[lang="en"] .title-vertical__sub  { font-size: clamp(0.8rem, min(3.6vw, 4vh), 1.5rem); margin-top: 0.5em; font-weight: 400; }   /* 英字は細いと写真の上で読みにくいので少し太く */
    /* 英語のサブタイトル（The 64th Cultural Festival）は長いので、狭いスマホでは「Scroll ↓」を少し上に上げて重ならないようにする */
    @media (max-width: 480px) {
      html[lang="en"] .scroll-hint { bottom: calc(100% - var(--vis-h, 100%) + clamp(1rem, 4vh, 2.5rem) + 3.4rem + env(safe-area-inset-bottom, 0px)); }
    }

    @media (prefers-reduced-motion: reduce) {
      .is-loaded .title-vertical, .is-title-done .title-horizontal { animation-duration: 0.01s; animation-delay: 0s; }
      .scroll-hint span { animation: none; }
    }

    @media (max-width: 600px) {
      .title-horizontal { left: 1rem; bottom: calc(100% - var(--vis-h, 100%) + 1rem + env(safe-area-inset-bottom, 0px)); }
      .scroll-hint { bottom: calc(100% - var(--vis-h, 100%) + 1rem + env(safe-area-inset-bottom, 0px)); }
      .carousel__btn { width: 2.3rem; height: 2.3rem; }
    }
  </style>
</head>
<body>

  <!-- ==================================================

  <section class="hero" id="hero">

    <!-- ▼▼▼ 背景画像 ▼▼▼

         ・heroBlur = 横長画面の左右を埋める「ぼかして拡大した背景」（同じ画像を自動で使用）

    <img class="hero__bg-blur" id="heroBlur" alt="" aria-hidden="true">

    <!-- ▲▲▲ 背景画像ここまで ▲▲▲ -->

    <div class="hero__content">

          { name: "2年5組", file: "2-5", title: "FUMINORI’S DINER 25", text: "ここはネオンが輝きしレコードから音楽が流れるアメリカンダイナー。熱々のたこ焼きと焼きそばを味わいながら映画のワンシーンのようなひと時をお楽しみください。", en: { name: "Class 2-5", title: "FUMINORI’S DINER 25", text: "This is an American diner glowing with neon, with music playing from records. Enjoy piping-hot takoyaki and yakisoba while savoring a moment like a scene from a movie." }, img: "" },

          { name: "2年8組", file: "2-8", title: "グランメゾン リカ", text: "私たち2年8組は「グランメゾン東京」をモチーフに二高生やお客様からの三つ星をいただくためにたくさんの話し合いを重ねてきました。Bon appétit!!", en: { name: "Class 2-8", title: "Grand Maison Rika", text: "Class 2-8 took inspiration from “Grand Maison Tokyo” and held countless discussions in hopes of earning three stars from Daini students and our guests. Bon appétit!!" }, img: "" },

          { name: "2年1組", file: "2-1", title: "VSくっしー", text: "あの人気番組を文化祭で再現！？さまざまなゲームに挑戦すると景品がもらえます！最高点を取ることができるのは果たして誰なのか。ぜひお越しください！！", en: { name: "Class 2-1", title: "VS Kusshi", text: "We're recreating that famous TV show at the festival?! Take on a variety of games and win prizes! Who will get the highest score? Please come and join us!!" }, img: "" },
          { name: "2年A組", file: "2-A", title: "ニノエ美術館 第二展示室", text: "【緊急募集】ニノエ美術館、第二展示室の警備員を募集しています！作品の状態を確認するだけの簡単なお仕事！※命の保証はできかねます。", en: { name: "Class 2-A", title: "Ninoe Museum, Exhibition Room 2", text: "[Urgent Recruitment] The Ninoe Museum is hiring a guard for Exhibition Room 2! It's an easy job: just check the condition of the artworks! *We cannot guarantee your life." }, img: "" },
          { name: "1年1組", file: "1-1", title: "ゴールできたらハイチーズ！ハロウィン教室でスクリーム！", text: "一足早く第二にハロウィン到来！絶叫必須のおばけ屋敷と最高の思い出を残せるフォトスポットが誕生！新体験の恐怖と楽しさをあなたに。", en: { name: "Class 1-1", title: "Say Cheese at the Goal! Scream in the Halloween Classroom!", text: "Halloween arrives early at Daini! A must-scream haunted house and a photo spot for unforgettable memories! Experience new thrills and fun." }, img: "" },
          { name: "1年2組", file: "1-2", title: "ドキドキハラハラ格付けチェック", text: "あなたの感覚は一流？二流？様々な格付けチェックで見て聞いて、真贋を見抜け！挑戦後はお菓子やフォトスポットを用意しています。", en: { name: "Class 1-2", title: "Heart-Pounding Ranking Check", text: "Is your sense first-class or second-class? See and hear your way through various ranking checks and tell real from fake! After the challenge, we have snacks and a photo spot ready." }, img: "" },
          { name: "1年4組", file: "1-4", title: "HOLLYWOOD体験", text: "あなたもハリウッドスターになってみませんか？１年４組ではレッドカーペットの上を歩きハリウッドスターの気分を味わうことができます。ぜひおこし下さい！", en: { name: "Class 1-4", title: "HOLLYWOOD Experience", text: "Want to become a Hollywood star? In Class 1-4 you can walk the red carpet and feel like a Hollywood star. Please drop by!" }, img: "" },
          { name: "1年6組", file: "1-6", title: "神秘的な教室", text: "プラネタリウムとフォトスポットを合わせた僕たちの最高傑作です。輝いている第二の中で美しく広がる神秘的な世界。どうぞ立ち寄ってみてください。", en: { name: "Class 1-6", title: "Mysterious Classroom", text: "A planetarium combined with a photo spot: our masterpiece. Within the shining Daini, a mysterious world spreads out beautifully. Please stop by." }, img: "" },
          { name: "1年7組", file: "1-7", title: "ミニスポッチャ", text: "お好み焼きのような個性豊かなメンバーが混ざり合い、最高に楽しくて面白い特設スポッチャが完成！笑顔あふれる熱々の空間へ、みんなで一緒に遊びに来てね！", en: { name: "Class 1-7", title: "Mini Spo-Cha", text: "A mix of members as individual as okonomiyaki has created the most fun, most entertaining special Spo-Cha corner! Come play with us in this smile-filled, piping-hot space!" }, img: "" },
          { name: "1年A組", file: "1-A", title: "笑神竜神図屏風", text: "伝承華というテーマから、二高60周年記念キャラの竜くんとニコちゃんを風神雷神に見立て、肥後六花と描きました。竜胆も描かれているので探してみてください。", en: { name: "Class 1-A", title: "Folding Screen of the Laughing God and Dragon God", text: "Inspired by the theme “Densho-ka,” we painted our Daini 60th-anniversary mascots Ryu-kun and Nico-chan as the Wind and Thunder Gods, together with the Higo Rokka flowers. Rindo (gentian) flowers are painted too, so try to find them!" }, img: "" }
        ]

      {
        id: "stage",
        title: "ステージ",
        titleEn: "Stage",
        items: [
          // ▼ ステージの画像差し替え箇所（images/stage/ファイル名.jpg を置くと自動表示）
          { name: "2年3組", file: "2-3", title: "兎と亀", text: "昔々、兎と亀がそれぞれ徒党を組んでおった。両者はお互いに嫌い合っていたそうな。ある年、不作に見舞われ、飢饉に陥ってしまった。これは、そのときのお話。", en: { name: "Class 2-3", title: "The Rabbit and the Tortoise", text: "Once upon a time, a rabbit and a tortoise each formed their own band of followers. The two groups hated each other. One year, a poor harvest brought famine. This is the tale of that time." }, img: "" },
          { name: "2年7組", file: "2-7", title: "イケダ探し", text: "何者かに襲われた池田先生をアイテムを集めて助けよう！※この作品は映画ちいかわのパロディです。楽しく見たい人は映画ちいかわの予習をしておいてね！", en: { name: "Class 2-7", title: "Searching for Ikeda", text: "Ikeda-sensei has been attacked by someone! Collect items and save him! *This work is a parody of the movie “Chiikawa.” If you want to enjoy it, study the Chiikawa movie beforehand!" }, img: "" },
          { name: "1年3組", file: "1-3", title: "We’re team Takuji!", text: "１年３組は、私たちの良さである明るさ、元気、おもしろさをいかした個性あふれるダンスをおどります。絶対面白くて魅力的で楽しいのでぜひ来てください！！", en: { name: "Class 1-3", title: "We’re team Takuji!", text: "Class 1-3 will perform dances full of personality, drawing on our strengths: cheerfulness, energy, and fun. It will absolutely be funny, charming, and enjoyable. Please come!!" }, img: "" },
          { name: "1年5組", file: "1-5", title: "廃部寸前！？探偵部と１００万円の花瓶", text: "ある高校の探偵部。突然彼らに廃部が言い渡される！？事件を解決すれば廃部を阻止できるらしい！真犯人は一体誰だ？コメディ×ミステリーの痛快劇！！乞うご期待！！", en: { name: "Class 1-5", title: "On the Brink of Disbandment?! The Detective Club and the 1-Million-Yen Vase", text: "A high school detective club is suddenly told it will be disbanded?! Solve the case and the club may be saved! Who is the real culprit? A comedy × mystery thriller!! Stay tuned!!" }, img: "" },
          { name: "1年8組", file: "1-8", title: "赤点回避 プリキュア", text: "いつも通りのテスト返却のはずだった。赤点をとった生徒たちは絶望しゾンビ化！そこに現れたのはまさかのプリキュア！みんなでプリキュアを応援しよう！", en: { name: "Class 1-8", title: "Avoiding Failing Grades: Pretty Cure", text: "It was supposed to be just another day of getting tests back. The students who failed despaired and turned into zombies! Then, unexpectedly, Pretty Cure appeared! Let's all cheer for Pretty Cure!" }, img: "" },
          { name: "1年S組", file: "1-S", title: "1年S組オンステージ", text: "完全オリジナルストーリーでおくるギャグホラーステージ。夜の学校に閉じ込められた主人公たち。最後にどんでん返しが！！細部まで見逃すな！！！！！！", en: { name: "Class 1-S", title: "Class 1-S On Stage", text: "A gag-horror stage with a completely original story. The protagonists are trapped in a school at night. A twist awaits at the end!! Don't miss a single detail!!!!!!" }, img: "" }
        ]

        items: [
          // ▼ 有志発表の画像差し替え箇所（images/yushi/ファイル名.jpg を置くと自動表示）
          { name: "grows", yomi: "ぐろうず", file: "grows", title: "LOVE2000とタッチを披露", text: "こんにちは！growsです。今回はLOVE2000とタッチを披露します。懐かしさを感じる人も初めて聴く人も楽しめるライブにします！", en: { name: "grows", title: "Performing “LOVE2000” and “Touch”", text: "Hello! We're grows. This time we'll perform “LOVE2000” and “Touch.” We'll make it a live show enjoyable both for those feeling nostalgic and for those hearing the songs for the first time!" }, img: "" },
          { name: "GIRLs", yomi: "がるず", file: "girls", title: "ダンス", text: "私たちは、みんなで心を一つにして最高のステージを届けます！笑顔あふれるダンスと迫力のあるパフォーマンスを、ぜひ最後までお楽しみください。", en: { name: "GIRLs", title: "Dance", text: "We'll come together with one heart to deliver the best stage! Please enjoy our smile-filled dancing and powerful performance until the very end." }, img: "" },
          { name: "金木犀", yomi: "きんもくせい", file: "kinmokusei", title: "クリープパイプとaikoの曲を演奏", text: "こんにちは！“金木犀”です。クリープパイプとaikoの曲を演奏します。秋風に乗せて、私たちの青春を全力でお届けするので、一緒に盛り上がりましょう！！", en: { name: "Kinmokusei (Osmanthus)", title: "Performing songs by Creep Pipe and aiko", text: "Hello! We are “Kinmokusei.” We'll play songs by Creep Pipe and aiko. Riding on the autumn breeze, we'll give our all to deliver our youth, so let's get excited together!!" }, img: "" },
          { name: "SONMINS", yomi: "そんみんず", file: "sonmins", title: "バンド", text: "皆さんこんにちは村民ズです。昨年に引き続き文化祭ステージで演奏させていただくことになりました。楽しんでいただけたら幸いです。よろしくお願いします！！", en: { name: "SONMINS", title: "Band", text: "Hello everyone, we are Sonmins (“The Villagers”). Following last year, we have the honor of performing on the festival stage again. We hope you enjoy it. Thank you!!" }, img: "" },
          { name: "24時30分", yomi: "にじゅうよじさんじゅっぷん", file: "2430", title: "バンド", text: "教室では静かに、ステージではうるさく。そんなバンドです。文化祭に来たなら、俺たちの音を聴いてから帰ってください。一瞬で終わる青春を、一生残る爆音に。", en: { name: "Half past midnight", title: "Band", text: "Quiet in the classroom, loud on the stage: that's the kind of band we are. If you came to the festival, hear our sound before you go home. We turn fleeting youth into a booming roar that lasts a lifetime." }, img: "" },
          { name: "かにクラブ", yomi: "かにくらぶ", file: "kani-club", title: "漫才", text: "ハイスクールマンザイ２０２６ファイナリストのかにクラブと申します。どうか温かく見守って、大きな声で笑ってやってください。", en: { name: "Kani Club", title: "Manzai (Comedy Duo)", text: "We're Kani Club, finalists of High School Manzai 2026. Please watch over us warmly and laugh out loud for us." }, img: "" },
          { name: "いぬやさい", yomi: "いぬやさい", file: "inuyasai", title: "漫才", text: "お笑い好きの女子２人が、先輩コンビ「かにクラブ」に憧れて漫才に挑戦します。学校での漫才は初めてですが、果たしてどうなるのか。ぜひお楽しみください。", en: { name: "Inuyasai", title: "Manzai (Comedy Duo)", text: "Two girls who love comedy take on manzai, inspired by the senior duo “Kani Club.” It's our first manzai at school. How will it go? Please look forward to it." }, img: "" },
          { name: "ロングヘア", yomi: "ろんぐへあ", file: "longhair", title: "歌とギター", text: "名前はロングヘアですが、短い髪の2人が演奏します。こういう場で演奏するのははじめてなので、温かい目で見てください。", en: { name: "Long Hair", title: "Vocals and Guitar", text: "Our name is Long Hair, but the two of us who will perform have short hair. This is our first time performing at an event like this, so please watch with warm eyes." }, img: "" },
          { name: "ニコLOVE", yomi: "にこらぶ", file: "nico-love", title: "ダンス", text: "私たちはかわいいかわいいアイドルソングを5曲披露します。かわいい振り付けや衣装に注目してくださると嬉しいです。全員で一緒に盛り上がりましょう！", en: { name: "Nico LOVE", title: "Dance", text: "We'll perform five super-cute idol songs. We'd be happy if you'd pay attention to our cute choreography and costumes. Let's all get excited together!" }, img: "" }
        ]

        ],
        items: [
          // ▼ 部活動の画像差し替え箇所（images/club/ファイル名.jpg を置くと自動表示）
          { name: "化学部", yomi: "かがくぶ", file: "chemistry", title: "ペットボトルロケットと液体窒素", text: "私たち化学部では、ペットボトルロケットと、液体窒素を使った実験を行います。エタノールや液体窒素について学び、一緒に実験しましょう！化学室Aで行います。", en: { name: "Chemistry Club", title: "Plastic Bottle Rockets and Liquid Nitrogen", text: "The Chemistry Club will hold plastic-bottle rocket and liquid nitrogen experiments. Learn about ethanol and liquid nitrogen and experiment with us! Held in Chemistry Room A." }, img: "" },
          { name: "物理部", yomi: "ぶつりぶ", file: "physics", title: "実験器具展示・自作コースターの配布", text: "物理室ではお馴染みの実験器具はもちろん、少し変わった装置を展示しています。物理学に興味がある人も、そうでない人もぜひ気軽にお越しください！", en: { name: "Physics Club", title: "Experimental Equipment Exhibit & Handmade Coaster Giveaway", text: "In the physics room we're exhibiting familiar experimental instruments as well as some unusual devices. Whether or not you're interested in physics, feel free to drop by!" }, img: "" },
          { name: "生物部", yomi: "せいぶつぶ", file: "biology", title: "有「亀」記念 出走！カメレース！", text: "のんびりじゃない！？生物部主催、カメたちの白熱したレースを見に来ませんか？ただいま出走予想を受付中！当てた方には生物部特製の景品をプレゼントします！", en: { name: "Biology Club", title: "A Tortoise Commemoration: Go! Turtle Race!", text: "Not so leisurely?! Come see a heated turtle race hosted by the Biology Club! Race predictions are being accepted now! Those who guess correctly will receive a special prize from the Biology Club!" }, img: "" },
          { name: "地学部", yomi: "ちがくぶ", file: "earth-science", title: "プラネタリウム", text: "プラネタリウムで流れる星の世界へ。地学部の教室で、ほっと一息つきませんか。癒しの時間をお届けします。静かな星空の下であなたのお越しをお待ちしてます‼", en: { name: "Earth Science Club", title: "Planetarium", text: "Step into a world of flowing stars in the planetarium. Why not take a breather in the Earth Science Club's classroom? We offer a healing time under a quiet starry sky. We look forward to seeing you‼" }, img: "" },
          { name: "写真部", yomi: "しゃしんぶ", file: "photo", title: "二高写真部写真界館", text: "写真部員が撮った沢山の写真をかざっています。写真に興味のある方、いろいろな景色が見てみたい方など、ぜひ一度見に来てみてください！", en: { name: "Photography Club", title: "Daini Photography Club Photo Gallery", text: "Many photos taken by Photography Club members are on display. If you're interested in photography or want to see all kinds of scenery, please come take a look!" }, img: "" },
          { name: "普通科美術部/美術選択者", yomi: "ふつうかびじゅつぶ", wrap: "普通科美術部|美術選択者", sep: ["/", "・"], file: "art-general", title: "普通科作品展示 and アートワークショップ", text: "「描く立体、感じるアート」をコンセプトに、誰でも簡単にできるテクスチャーアート体験を行います。普通科作品も展示しているので、ぜひお越しください！", en: { name: "General Course Art Club / Art Elective Students", title: "General Course Artworks & Art Workshop", text: "With the concept “Drawn Solids, Felt Art,” we offer an easy texture art experience that anyone can do. Works by General Course students are also on display, so please stop by!" }, img: "" },
          { name: "美術科美術部", yomi: "びじゅつかびじゅつぶ", wrap: "美術科|美術部", file: "art-course", title: "美術科美術部制作展", text: "こんにちは、美術科美術部です。今年も２−A、３ーA教室で美術科の生徒が授業や二高ゼミ、自主的に制作した作品を展示します。ぜひ見に来てください！", en: { name: "Art Course Art Club", title: "Art Course Art Club Exhibition", text: "Hello, we're the Art Course Art Club. This year again, Art Course students will display works made in class, in Daini Seminar, and on their own in Classrooms 2-A and 3-A. Please come see them!" }, img: "" },
          { name: "茶道部", yomi: "さどうぶ", file: "tea", title: "お茶点て体験", text: "文化祭では浴衣を着てお点前（おてまえ）を披露させていただきます。このお茶席ではお茶を点（た）てる体験ができます。海外で人気が高まっている日本の文化を体験しませんか。", en: { name: "Tea Ceremony Club", title: "Tea-Making Experience", text: "At the festival, we'll perform the tea ceremony wearing yukata. At this tea room you can try making tea yourself. Why not experience Japanese culture, which is growing in popularity overseas?" }, img: "" },
          { name: "英語部", yomi: "えいごぶ", file: "english", title: "What a wonderful world!!!!!!!", text: "英語部では「世界の国々」をテーマにフォトスポットを作成しました。友達と写真を撮って、素敵な思い出を作って下さい！たくさんの来客待ってます。", en: { name: "English Club", title: "What a wonderful world!!!!!!!", text: "The English Club created a photo spot on the theme “Countries of the World.” Take photos with friends and make wonderful memories! We look forward to many visitors." }, img: "" },
          { name: "書道部", yomi: "しょどうぶ", file: "calligraphy", title: "書道パフォーマンス", text: "私たち書道部は今年も文化祭を盛り上げます！１日目はパフォーマンスで文化祭がスタートし、２日目は、校内書道展を行います。「書」を一緒に楽しみましょう！", en: { name: "Calligraphy Club", title: "Calligraphy Performance", text: "The Calligraphy Club will liven up the festival again this year! On Day 1 the festival kicks off with a performance, and on Day 2 we hold the school calligraphy exhibition. Let's enjoy “calligraphy” together!" }, img: "" },
          { name: "調理同好会", yomi: "ちょうりどうこうかい", file: "cooking", title: "ブルッキーの販売", text: "ブルッキーはブラウニーとクッキーを組み合わせたお菓子です。チョコの濃厚な味わいと食感が楽しめます。ぜひ一度、味わって見てください！", en: { name: "Cooking Club", title: "Selling Brookies", text: "A Brookie is a sweet that combines a brownie and a cookie. You can enjoy the rich chocolate flavor and the texture. Please give it a try!" }, img: "" },
          { name: "放送部", yomi: "ほうそうぶ", file: "broadcast", title: "観て！聴いて！放送部作品 selection", text: "第二高校放送部です。私たちが過去制作してきた、テレビ・ラジオ媒体での７～８分の番組を一挙公開！飲食がてら休憩がてら、私たちの歩みの証をご覧ください！", en: { name: "Broadcasting Club", title: "Watch! Listen! Broadcasting Club Selection", text: "We're the Daini High School Broadcasting Club. We're showing, all at once, the 7-to-8-minute TV and radio programs we've produced in the past! Take a break with a meal or a snack and see the record of our journey." }, img: "" }

    /* ==================================================
       ★画像フォルダの設定（GitHubにアップロードする画像の置き場所）

       index.html と同じ場所に「images」フォルダを作り、次のように画像を置きます。

         images/
          ├─ hero.jpg          ← トップの大きな背景画像
          ├─ food/2-2.jpg      ← 食バザー 2年2組（food/2-4.jpg, 2-5 … と続く）
          ├─ exhibit/1-1.jpg   ← 展示
          ├─ stage/1-3.jpg     ← ステージ
          ├─ yushi/grows.jpg   ← 有志発表
          ├─ club/chemistry.jpg ← 部活動（ファイル名は各団体の file の値）
          └─ other/shop.jpg    ← その他団体

       ・ファイル名は半角英数字で、大文字小文字も正確に（GitHub Pagesは区別します）
       ・拡張子は .jpg .jpeg .png .webp（大文字の .JPG なども可）。画像が無い所は空欄（グレーの枠など）になります
       ・うまく表示されないときは、ページのURLの末尾に ?imgcheck を付けて開くと、
         どの画像が見つかり、どの画像が見つからないか（探している場所）が一覧で出ます
       ・画像は横幅1600px・1MB以下くらいに軽くしておくと表示が速くなります
    ================================================== */
    const IMAGE_FOLDER = "images";
    const IMAGE_EXTENSIONS = ["jpg", "jpeg", "png", "webp", "JPG", "JPEG", "PNG", "WEBP"];   // 探す拡張子（順番に試します）
    const HERO_IMAGE = "";                                     // 例: "https://…/top.jpg"（空なら images/hero.* を探す）

    /* ==================================================
       ★フッターの設定
       ■ 校章・バナー画像の差し替え（かんたん）：
           images/footer/emblem.png    ← 校章マーク
           images/footer/banner1.jpg 〜 banner5.jpg ← バナー（左から／上から順）
           （.jpg .jpeg .png .webp に対応／無ければ空欄）
         ※img にURLを書くと、そちらが優先されます。
       ■ リンク先：url を書き換える。label はバナーの説明（画像の代替テキスト）
    ================================================== */
    const FOOTER_EMBLEM = { file: "emblem", img: "" };
    const FOOTER_BANNERS = [
      { label: "熊本県立第二高等学校 公式サイト", labelEn: "Official Website of Kumamoto Prefectural Daini High School", url: "https://kumamoto-d2hs.ed.jp/",       file: "banner1", img: "" },
      { label: "Instagram（d2_daini）", labelEn: "Instagram (d2_daini)",           url: "https://www.instagram.com/d2_daini/", file: "banner2", img: "" },
      { label: "ビッグスカイ高校", labelEn: "Big Sky High School",                 url: "https://bigsky.mcpsmt.org/",          file: "banner3", img: "" },
      { label: "同窓会 りんどう会", labelEn: "Rindokai Alumni Association",                 url: "https://www.rindoukai.net/",          file: "banner4", img: "" },
      { label: "科学技術振興機構（JST）", labelEn: "Japan Science and Technology Agency (JST)",           url: "https://www.jst.go.jp/",              file: "banner5", img: "" }
    ];

    /* 自動スライドの間隔（ミリ秒）。4000〜5000が目安 */
    const AUTO_SLIDE_MS = 4500;
    /* 自動スライドで1枚動くときの速さ（ミリ秒）。大きいほどゆっくり */
    const SLIDE_MS = 700;
    /* 「＜」「＞」ボタンを押したときの速さ（ミリ秒）。200〜300でスッと素早く動きます */
    const BUTTON_SLIDE_MS = 250;

    /* カルーセルの見え方
       端のカードがどれくらい見えるか（0.35 = 35%だけ見える＝65%が隠れる）。0.5未満で調整してください
       ・PC　 ：横5枚（中央＋左右の隣＋両端の見切れ）
       ・スマホ：横3枚（中央＋両端の見切れ） */
    const EDGE_VISIBLE = 0.35;
    /* この幅(px)以下をスマホ表示とみなす（CSSの max-width: 767px と合わせる） */
    const MOBILE_MAX_WIDTH = 767;

    /* ==================================================
       以下はプログラム本体（初心者の方は触らなくてOKです）
    ================================================== */

    // ---------- 多言語（日本語 / English） ----------
    // ・固定の文言：下の I18N（日本語 ja / 英語 en）。英語を直したいときはここ
    // ・団体のデータ：CATEGORIES の en: { name, title, text }（団体名・企画名・紹介文）と titleEn（カテゴリ名・グループ名）
    // ・HTML側の data-i18n="キー" が付いた場所は、言語に合わせて自動で書き換わります
    const I18N = {
      ja: {
        pageTitle: "第64回 文化祭｜伝承華",
        heroMain: "伝承華",
        heroSub: "ー受け継ぐ想い、咲き誇る今ー",
        subtitle: "第64回<br>文化祭",
        viewAll: "＜すべて表示＞",
        prev: "前へ", next: "次へ", close: "閉じる",
        footerName: "熊本県立第二高等学校<span>Kumamoto Prefectural Daini High School</span>",
        footerAddress: "〒862-0901 熊本県熊本市東区東町3-13-1",
        footerAdmin: "管理者 生徒会広報担当者",
        emblemAlt: "熊本県立第二高等学校 校章",
        imageAlt: "の画像"
      },
      en: {
        pageTitle: "The 64th Cultural Festival | Denshōka",
        heroMain: "Densh<span class=\"macron\">ō</span>ka",
        heroSub: "– Inherited Feelings, Blooming Now –",
        subtitle: "The 64th<br>Cultural Festival",
        viewAll: "< View All >",
        prev: "Previous", next: "Next", close: "Close",
        footerName: "Kumamoto Prefectural Daini High School",
        footerAddress: "3-13-1 Higashimachi, Higashi-ku, Kumamoto City, Kumamoto 862-0901, Japan",
        footerAdmin: "Administrator: Student Council Public Relations Staff",
        emblemAlt: "Kumamoto Prefectural Daini High School emblem",
        imageAlt: " (image)"
      }
    };
    let lang = "ja";                                   // 現在の言語。ページを開いたときは必ず日本語（選んだ言語は保存しません）
    const t = (key) => I18N[lang][key];
    // 団体データの文字（name / title / text）。英語のときは en の中を使い、無ければ日本語のまま
    const itemText = (item, field) => (lang === "en" && item.en && item.en[field]) || item[field] || "";
    const catTitle = (cat) => (lang === "en" && cat.titleEn) || cat.title;
    const groupTitle = (g) => (lang === "en" && g.titleEn) || g.title;

    // カードに表示する団体名のHTML。日本語では wrap があれば、| の位置でだけ折り返す（例：普通科 / 美術部）
    function nameHTML(item) {
      if (lang === "en") return itemText(item, "name");
      if (!item.wrap) return item.name;
      // 外側の <span> で包む（折り返し位置を | の所だけにするため）
      const parts = item.wrap.split("|");
      if (item.sep) {
        // 区切り記号つき：1行なら「A/B」、2段になるときは「A」「・」「B」の3行（fitSeparators が切り替える）
        return `<span class="namewrap"><span class="nb">${parts[0]}</span><wbr>` +
               `<span class="nb sep" data-one="${item.sep[0]}" data-wrapped="${item.sep[1]}">${item.sep[0]}</span><wbr>` +
               `<span class="nb">${parts[1]}</span></span>`;
      }
      return "<span>" + parts.map((part) => `<span class="nb">${part}</span>`).join("<wbr>") + "</span>";
    }

    // カード1枚分のHTMLを作る
    function cardHTML(item, cat, isClone, index) {
      // 画像の src は、近くに来たとき／ポップアップを開いたときに設定します（hydrateImages）
      const srcAttr = item.src ? ` src="${item.src}"` : "";
      return `<figure class="card" data-i="${index}"${isClone ? ' aria-hidden="true"' : ''}>
        <div class="card__img blurbg"><img${srcAttr} alt="" draggable="false" loading="lazy" decoding="async"></div>
        <figcaption class="card__name">${nameHTML(item)}</figcaption>
      </figure>`;
    }

    // ---------- 画像の自動検出（images フォルダにある画像を探す） ----------
    // 画像が読み込めるか確認（3秒で打ち切り）
    // 画像ファイルがあるか確認する。
    // ・通常（GitHub Pagesなど）は HEAD リクエストで「存在するか」だけ確認 → 画像が重くても待たない
    // ・パソコン上で index.html を直接開いた場合などは、実際に読み込んで確認（最大30秒待つ）
    async function probeImage(src) {
      if (location.protocol === "http:" || location.protocol === "https:") {
        try {
          const res = await fetch(src, { method: "HEAD", cache: "no-cache" });
          if (res.ok) return true;
          if (res.status !== 405 && res.status !== 501) return false;   // 404など＝無い
        } catch (e) { /* 通信エラーのときは下の方法で確認 */ }
      }
      return new Promise((resolve) => {
        const img = new Image();
        const timer = setTimeout(() => resolve(false), 30000);
        img.onload = () => { clearTimeout(timer); resolve(true); };
        img.onerror = () => { clearTimeout(timer); resolve(false); };
        img.src = src;
      });
    }
    // images/フォルダ/ファイル名.拡張子 を順に探す。見つからなければ ""
    async function findImage(folder, file) {
      for (const ext of IMAGE_EXTENSIONS) {
        const src = [IMAGE_FOLDER, folder, encodeURIComponent(file)].filter(Boolean).join("/") + "." + ext;
        if (await probeImage(src)) return src;
      }
      return "";
    }
    // 団体1件の画像を決める（必要になったときに1回だけ）：img指定 → imagesフォルダ。どちらも無ければ空欄（画像なし）
    function resolveItemImage(cat, item) {
      if (!item._p) {
        item._p = (async () => {
          item.found = item.img || (item.file ? await findImage(cat.id, item.file) : "");   // 見つかった画像（無ければ ""）
          item.src = item.found;                      // 画像が無いときは "" のまま（仮画像は出さない）
          return item.src;
        })();
      }
      return item._p;
    }
    // コンテナ内のカード画像に、実際の src を設定する（まだ設定されていないものだけ）
    function hydrateImages(container, cat) {
      container.querySelectorAll(".card").forEach((card) => {
        const img = card.querySelector("img");
        if (!img || img.getAttribute("src")) return;
        resolveItemImage(cat, cat.items[Number(card.dataset.i)]).then((src) => {
          if (src && !img.getAttribute("src")) img.src = src;      // 画像が無いときは何もしない（空の枠のまま）
        });
      });
    }
    // 画面の近くに来たら fn を1回だけ実行する（ヒーロー画像の読み込みが終わってから）
    function whenNear(el, fn) {
      if (!("IntersectionObserver" in window)) { fn(); return; }
      const io = new IntersectionObserver((entries) => {
        if (!entries.some((e) => e.isIntersecting)) return;
        io.disconnect();
        heroReady.then(fn);
      }, { rootMargin: "600px 0px" });   // 画面の600px手前から読み込み開始
      io.observe(el);
    }
    // 画像の読み込みが終わったら is-ready を付けて、ふわっと表示する
    // あわせて、枠（.blurbg）と画像の縦横比が違うときは、同じ画像をぼかして背景に敷く（--bg を設定）
    document.addEventListener("load", (e) => {
      const img = e.target;
      if (img.tagName !== "IMG") return;
      img.classList.add("is-ready");
      const box = img.closest(".blurbg");
      if (!box || !img.naturalWidth) return;
      const boxRatio = box.clientHeight ? box.clientWidth / box.clientHeight : 0;
      const imgRatio = img.naturalWidth / img.naturalHeight;
      if (boxRatio && Math.abs(imgRatio / boxRatio - 1) < 0.04) { box.style.removeProperty("--bg"); return; }   // ほぼ同じ比率なら背景は不要
      box.style.setProperty("--bg", `url("${img.currentSrc || img.src}")`);
    }, true);

    // ヒーロー（背景）画像を決める：HERO_IMAGE → images/hero.*。無ければ ""（空）
    async function resolveHero() {
      return HERO_IMAGE || (await findImage("", "hero"));
    }

    // ---------- カテゴリセクションの生成 ----------
    const root = document.getElementById("categories");

    function buildCategories() {
    CATEGORIES.forEach((cat) => {
      const sec = document.createElement("section");
      sec.className = "category";
      sec.id = "cat-" + cat.id;
      sec.innerHTML = `
        <div class="category__head">
          <h2 class="category__title">${catTitle(cat)}</h2>
          <button class="all-btn" type="button" data-i18n="viewAll">${t("viewAll")}</button>
        </div>
        <div class="carousel">
          <button class="carousel__btn carousel__btn--prev" type="button" aria-label="${t("prev")}" data-i18n-aria="prev">＜</button>
          <div class="carousel__viewport"><div class="carousel__track"></div></div>
          <button class="carousel__btn carousel__btn--next" type="button" aria-label="${t("next")}" data-i18n-aria="next">＞</button>
        </div>`;
      root.appendChild(sec);

      const carousel = sec.querySelector(".carousel");
      setupCarousel(carousel, cat);
      sec.querySelector(".all-btn").addEventListener("click", () => openModal(cat));
      // この部門の画像は、画面の近くに来てから読み込む（初期表示を軽くするため）
      whenNear(sec, () => {
        carousel._active = true;
        hydrateImages(carousel.querySelector(".carousel__track"), cat);
      });
    });
    }

    // ---------- 無限ループ・カルーセルの動作 ----------
    // 仕組み：団体カードを前後に複製（クローン）して並べ、
    //         位置が1セット分ずれたら見た目が変わらないまま元の位置へ戻す → 途切れずに回り続けます。
    function setupCarousel(carousel, cat) {
      const viewport = carousel.querySelector(".carousel__viewport");
      const track = carousel.querySelector(".carousel__track");
      const prev = carousel.querySelector(".carousel__btn--prev");
      const next = carousel.querySelector(".carousel__btn--next");
      const n = cat.items.length;
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

      let step = 0;   // カード1枚ぶんの移動量（カード幅＋すき間）
      let setW = 0;   // 団体カード1セットぶんの幅
      let base = 0;   // 本物（中央セット）の先頭位置
      let pos = 0;    // 現在のスクロール位置(px)
      let tween = null, raf = 0;

      const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
      const easeOut = (t) => 1 - Math.pow(1 - t, 3);
      const setHTML = (isClone) => cat.items.map((it, i) => cardHTML(it, cat, isClone, i)).join("");
      const render = () => { track.style.transform = `translate3d(${-pos}px,0,0)`; };
      const snap = (p) => base + Math.round((p - base) / step) * step;

      // カードを並べ直す（最初と画面サイズ変更時）。index=先頭に表示する団体の番号
      function build(index) {
        const V = carousel.clientWidth;                          // カルーセルの表示幅
        const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
        // 端のカードが EDGE_VISIBLE だけ見える大きさを逆算（PC=横5枚 / スマホ=横3枚）
        const mobile = window.innerWidth <= MOBILE_MAX_WIDTH;
        const cardW = mobile
          ? (V / 2 - gap) / (0.5 + EDGE_VISIBLE)
          : (V / 2 - 2 * gap) / (1.5 + EDGE_VISIBLE);
        carousel.style.setProperty("--card-w", cardW + "px");
        track.style.marginLeft = (V - cardW) / 2 + "px";         // 中央のカードを画面の真ん中へ
        step = cardW + gap;
        setW = step * n;
        const copies = Math.ceil(V / setW) + 1;                  // 左右に必要なクローン数
        let html = "";
        for (let i = 0; i < copies * 2 + 1; i++) html += setHTML(i !== copies);
        track.innerHTML = html;
        fitSeparators(track);                                    // 団体名が2段になるか判定
        if (carousel._active) hydrateImages(track, cat);        // 並べ直したときも画像を設定
        base = copies * setW;
        pos = base + index * step;
        tween = null;
        render();
      }

      // 位置が中央セットの外に出たら、1セットぶん戻す（見た目は変わらない）。戻した量を返す
      function wrap() {
        let d = 0;
        while (pos >= base + setW) { pos -= setW; d -= setW; }
        while (pos < base) { pos += setW; d += setW; }
        if (d && tween) { tween.from += d; tween.to += d; }
        return d;
      }

      // なめらかに target 位置まで動かす
      function animateTo(target, dur, ease) {
        tween = { from: pos, to: target, t0: performance.now(), dur: reduceMotion ? 1 : dur, ease };
        if (!raf) raf = requestAnimationFrame(tick);
      }
      function tick(now) {
        raf = 0;
        if (!tween) return;
        const t = Math.min(1, Math.max(0, (now - tween.t0) / tween.dur));
        pos = tween.from + (tween.to - tween.from) * tween.ease(t);
        wrap();
        render();
        if (t < 1) raf = requestAnimationFrame(tick); else tween = null;
      }

      // dir: 1=次へ / -1=前へ（常に1枚ずつ）
      function slideBy(dir, dur = SLIDE_MS, ease = easeInOut) {
        const cur = tween ? tween.to : snap(pos);
        animateTo(cur + dir * step, dur, ease);
      }

      // ボタン操作：素早くスッと動かし、自動再生のタイマーをリセット
      prev.addEventListener("click", () => { slideBy(-1, BUTTON_SLIDE_MS, easeOut); start(); });
      next.addEventListener("click", () => { slideBy(1, BUTTON_SLIDE_MS, easeOut); start(); });

      // オートスライド（マウスを乗せている間・ドラッグ中は停止）
      let timer = null, hovering = false, dragging = false;
      const stop = () => { clearInterval(timer); timer = null; };
      // ポップアップ（詳細／一覧）が開いている間は、自動再生しない
      const modalIsOpen = () => document.documentElement.classList.contains("modal-open");
      const start = () => {
        stop();
        if (!hovering && !modalIsOpen()) {
          timer = setInterval(() => { if (!dragging && !document.hidden && !modalIsOpen()) slideBy(1); }, AUTO_SLIDE_MS);
        }
      };
      // ポップアップが開いたら一時停止、閉じたら自動で再開（modalstate は下の updateScrollLock が送る合図）
      document.addEventListener("modalstate", (e) => { if (e.detail.open) stop(); else start(); });
      carousel.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") { hovering = true; stop(); } });
      carousel.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") { hovering = false; start(); } });

      // マウスドラッグ／タッチスワイプ（Pointer Events で共通処理）
      let startX = 0, startPos = 0, lastX = 0, lastT = 0, vel = 0, moved = false;
      viewport.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        dragging = true;
        tween = null;
        startX = lastX = e.clientX;
        startPos = pos;
        lastT = performance.now();
        vel = 0;
        moved = false;
        viewport.setPointerCapture(e.pointerId);
        viewport.classList.add("is-dragging");
        stop();
      });
      viewport.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        if (Math.abs(e.clientX - startX) > 6) moved = true;   // 6px以上動いたらタップではなくドラッグ
        const now = performance.now();
        const dt = now - lastT;
        if (dt > 0) vel = vel * 0.6 + ((lastX - e.clientX) / dt) * 0.4;   // 指/マウスの勢い(px/ms)
        lastX = e.clientX;
        lastT = now;
        pos = startPos - (e.clientX - startX);
        startPos += wrap();
        render();
      });
      const endDrag = (e) => {
        if (!dragging) return;
        dragging = false;
        viewport.classList.remove("is-dragging");
        const isTap = !moved && e.type === "pointerup";
        // ドラッグなら勢いを加味して近いカードに揃える／タップならその場に留める
        animateTo(snap(isTap ? pos : pos + vel * 200), 500, easeOut);
        start();
        if (isTap) {
          // タップ：指/マウスの下にあるカードの詳細ポップアップを開く
          const el = document.elementFromPoint(e.clientX, e.clientY);
          const card = el && el.closest(".card");
          if (card && card.dataset.i !== undefined) openDetail(cat, cat.items[Number(card.dataset.i)]);
        }
      };
      viewport.addEventListener("pointerup", endDrag);
      viewport.addEventListener("pointercancel", endDrag);

      // 画面サイズが変わったら並べ直す
      let resizeTimer = null;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          const idx = ((Math.round((pos - base) / step) % n) + n) % n;
          build(idx);
        }, 150);
      });

      build(0);
      start();
    }

    
    // ---------- ポップアップ（一覧モーダル／詳細モーダル） ----------
    const modal = document.getElementById("modal");           // 「すべて表示」の一覧
    const modalTitle = document.getElementById("modalTitle");
    const modalGrid = document.getElementById("modalGrid");
    const modalClose = document.getElementById("modalClose");
    const detail = document.getElementById("detail");         // 団体の詳細
    const detailTitle = document.getElementById("detailTitle");
    const detailSub = document.getElementById("detailSub");
    const detailText = document.getElementById("detailText");
    const detailImg = document.getElementById("detailImg");
    const detailClose = document.getElementById("detailClose");
    let modalFocus = null, detailFocus = null, modalCat = null, currentDetail = null, currentDetailCat = null;

    // どれかのポップアップが開いている間は、背景をスクロールさせない
    function updateScrollLock() {
      const anyOpen = modal.classList.contains("is-open") || detail.classList.contains("is-open");
      document.documentElement.classList.toggle("modal-open", anyOpen);
      document.dispatchEvent(new CustomEvent("modalstate", { detail: { open: anyOpen } }));   // カルーセルの自動再生を止める／再開する合図
    }

    // 一覧モーダル（その部門の全団体をグリッド表示）
    function renderModal(cat) {
      modalTitle.textContent = catTitle(cat);
      if (cat.groups) {
        // グループ分けあり：サブタイトル → その団体のカード、の順に並べる
        const used = new Set();
        const cardOf = (name) => {
          const i = cat.items.findIndex((it) => it.name === name);
          return i < 0 ? "" : cardHTML(cat.items[i], cat, false, i);
        };
        let html = cat.groups.map((g) => {
          g.names.forEach((n) => used.add(n));
          return `<h3 class="modal__group">${groupTitle(g)}</h3>` + g.names.map(cardOf).join("");
        }).join("");
        html += cat.items.map((it, i) => (used.has(it.name) ? "" : cardHTML(it, cat, false, i))).join("");   // groupsに無い団体は最後に
        modalGrid.innerHTML = html;
      } else {
        modalGrid.innerHTML = cat.items.map((it, i) => cardHTML(it, cat, false, i)).join("");
      }
      modalGrid.querySelectorAll(".card").forEach((c) => { c.setAttribute("role", "button"); c.tabIndex = 0; });
      hydrateImages(modalGrid, cat);                         // 一覧を開いたときに初めて画像を読み込む
    }
    function openModal(cat) {
      modalFocus = document.activeElement;
      modalCat = cat;
      renderModal(cat);
      modal.classList.add("is-open");
      fitSeparators(modalGrid);                               // 表示してから、1行／2段を判定
      updateScrollLock();
      modalClose.focus();
    }
    function closeModal() {
      modal.classList.remove("is-open");
      updateScrollLock();
      if (modalFocus) modalFocus.focus();
    }

    // 詳細モーダル：上＝団体名（＋企画名）／中＝紹介文／下＝画像 の順
    // 詳細の文字（団体名・企画名・紹介文）を、いまの言語で入れる
    function fillDetailText(item) {
      detailTitle.textContent = itemText(item, "name");
      const sub = itemText(item, "title");
      detailSub.textContent = sub;
      detailSub.hidden = !sub;
      detailText.textContent = itemText(item, "text");
      detailImg.alt = itemText(item, "name") + t("imageAlt");
    }
    function openDetail(cat, item) {
      detailFocus = document.activeElement;
      fillDetailText(item);
      // 詳細の大きな画像は、ポップアップを開いたときに初めて読み込む
      currentDetail = item;
      currentDetailCat = cat;
      detailImg.parentElement.style.removeProperty("--bg");   // 前の画像のぼかし背景を消す
      const detailBox = detailImg.parentElement;
      detailBox.hidden = true;                                  // 画像が無いときは、画像の枠ごと表示しない
      detailImg.removeAttribute("src");
      resolveItemImage(cat, item).then((src) => {
        if (currentDetail === item && src) { detailBox.hidden = false; detailImg.src = src; }
      });
      detail.classList.add("is-open");
      detail.querySelector(".modal__panel").scrollTop = 0;
      updateScrollLock();
      detailClose.focus();
    }
    function closeDetail() {
      detail.classList.remove("is-open");
      updateScrollLock();
      if (detailFocus) detailFocus.focus();
    }

    modalClose.addEventListener("click", closeModal);
    detailClose.addEventListener("click", closeDetail);
    modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });     // 背景クリックで閉じる
    detail.addEventListener("click", (e) => { if (e.target === detail) closeDetail(); });

    // 一覧の中のカードをクリック（またはEnter）→ 詳細モーダル
    modalGrid.addEventListener("click", (e) => {
      const card = e.target.closest(".card");
      if (card && modalCat) openDetail(modalCat, modalCat.items[Number(card.dataset.i)]);
    });
    modalGrid.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const card = e.target.closest(".card");
      if (card && modalCat) { e.preventDefault(); openDetail(modalCat, modalCat.items[Number(card.dataset.i)]); }
    });

    // Escキー：いちばん手前のポップアップから閉じる
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      if (!langMenu.hidden) { setLangMenu(false); langBtn.focus(); return; }   // 言語メニューが開いていれば、まずそれを閉じる
      if (detail.classList.contains("is-open")) closeDetail();
      else if (modal.classList.contains("is-open")) closeModal();
    });

    // ---------- 言語の切り替え ----------
    const langBtn = document.getElementById("langBtn");
    const langMenu = document.getElementById("langMenu");
    function setLangMenu(open) {
      langMenu.hidden = !open;
      langBtn.setAttribute("aria-expanded", String(open));
    }
    // 団体名の区切り（普通科美術部/美術選択者）：1行に収まれば「/」、収まらず2段になるときは「・」を単独の行にして3行にする
    function fitSeparators(root) {
      (root || document).querySelectorAll(".namewrap").forEach((w) => {
        const sep = w.querySelector(".sep");
        w.classList.remove("is-wrapped");
        sep.textContent = sep.dataset.one;
        const parts = w.querySelectorAll(".nb:not(.sep)");
        if (parts[1].offsetTop > parts[0].offsetTop + 2) {       // 折り返されている
          w.classList.add("is-wrapped");
          sep.textContent = sep.dataset.wrapped;
        }
      });
    }
    window.addEventListener("resize", () => { clearTimeout(fitSeparators._t); fitSeparators._t = setTimeout(() => fitSeparators(document), 250); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitSeparators(document));   // フォント読み込み後に幅が変わるので再判定

    // 画面全体の文字を、指定した言語に切り替える（ページの再読み込みは不要）
    function applyLang(next) {
      lang = next;
      document.documentElement.lang = next;                // CSS（英語時の横書きタイトルなど）も lang を見ています
      document.title = t("pageTitle");
      document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll("[data-i18n-html]").forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
      document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
      // フッターの校章・バナーの説明
      document.getElementById("footerEmblem").alt = t("emblemAlt");
      document.querySelectorAll("#footerBanners a").forEach((a, i) => {
        const b = FOOTER_BANNERS[i];
        const label = (lang === "en" && b.labelEn) || b.label;
        a.setAttribute("aria-label", label);
        const im = a.querySelector("img");
        if (im) im.alt = label;
      });
      // カテゴリ名と、スライダー内のカードの団体名
      CATEGORIES.forEach((cat) => {
        const sec = document.getElementById("cat-" + cat.id);
        if (!sec) return;
        sec.querySelector(".category__title").textContent = catTitle(cat);
        sec.querySelectorAll(".card").forEach((card) => {
          card.querySelector(".card__name").innerHTML = nameHTML(cat.items[Number(card.dataset.i)]);
        });
      });
      // 開いているポップアップも、その場で言語を切り替える
      fitSeparators(document);
      if (modal.classList.contains("is-open") && modalCat) { renderModal(modalCat); fitSeparators(modalGrid); }
      if (detail.classList.contains("is-open") && currentDetail) fillDetailText(currentDetail);
      // 言語メニューの選択中マーク
      langMenu.querySelectorAll("button[data-lang]").forEach((b) => b.setAttribute("aria-checked", String(b.dataset.lang === next)));
    }
    langBtn.addEventListener("click", () => setLangMenu(langMenu.hidden));
    langMenu.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-lang]");
      if (!b) return;
      if (b.dataset.lang !== lang) applyLang(b.dataset.lang);   // 今と同じ言語を選んだときは何もしない
      setLangMenu(false);
    });
    document.addEventListener("click", (e) => { if (!e.target.closest("#lang")) setLangMenu(false); });   // 外側をタップで閉じる

    // ---------- 並び順（自動）----------
    // ・「2年2組」のような学年つきクラス：2年 → 1年、同じ学年の中は組順（1,2,… → A → S）
    // ・それ以外の団体：yomi（ひらがな）の50音順
    // ・クラスとそれ以外が同じカテゴリにあるときは、クラスが先
    function classKey(item) {
      const m = item.name.match(/^(\d)年(.+)組$/);
      if (!m) return null;
      return { grade: Number(m[1]), kumi: /^\d+$/.test(m[2]) ? Number(m[2]) : 1000 + m[2].charCodeAt(0) };
    }
    const jaCollator = new Intl.Collator("ja");
    function compareItems(a, b) {
      const ka = classKey(a), kb = classKey(b);
      if (ka && kb) return (kb.grade - ka.grade) || (ka.kumi - kb.kumi);
      if (ka) return -1;
      if (kb) return 1;
      return jaCollator.compare(a.yomi || a.name, b.yomi || b.name);
    }
    CATEGORIES.forEach((cat) => {
      cat.items.sort(compareItems);
      (cat.groups || []).forEach((g) => {
        const byName = (n) => cat.items.find((it) => it.name === n) || { name: n };
        g.names.sort((x, y) => compareItems(byName(x), byName(y)));
      });
    });

    // ---------- 表示の組み立て ----------
    // 見出しボックス群（カルーセル）は、ここでは作りません。
    // ファーストビューのタイトル表示が完了してから、loadContent()（下の「ヒーロー」の項）で作ります。

    // ---------- フッター（校章・リンクバナー） ----------
    // バナーのリンクを作る（画像は近くに来てから読み込む）
    document.getElementById("footerBanners").innerHTML = FOOTER_BANNERS.map((b) =>
      `<li><a href="${b.url}" target="_blank" rel="noopener noreferrer" aria-label="${b.label}"><img alt="${b.label}" loading="lazy" decoding="async"></a></li>`
    ).join("");
    // 校章・バナー画像を決めて設定する：img指定 → images/footer/。無ければ、校章は非表示・バナーはグレーの空枠
    async function loadFooterImages() {
      const emblem = document.getElementById("footerEmblem");
      const imgs = document.querySelectorAll("#footerBanners img");
      const set = async (obj, imgEl, onNone) => {
        obj.found = obj.img || await findImage("footer", obj.file);
        if (obj.found) imgEl.src = obj.found; else onNone();
      };
      await Promise.all([
        set(FOOTER_EMBLEM, emblem, () => { emblem.style.display = "none"; }),
        ...FOOTER_BANNERS.map((b, i) => set(b, imgs[i], () => imgs[i].closest("a").classList.add("is-empty")))
      ]);
    }
    whenNear(document.getElementById("footer"), loadFooterImages);

    // ---------- 画像チェック表示（?imgcheck） ----------
    // 見つかった画像（✔）と、見つからなかった画像（✖：探している場所）を一覧にします
    async function showImageCheck() {
      const jobs = [];
      CATEGORIES.forEach((cat) => cat.items.forEach((it) => jobs.push(resolveItemImage(cat, it))));
      jobs.push(loadFooterImages());
      await Promise.all(jobs);
      const heroFound = heroImg.naturalWidth > 0;
      const rows = [[heroFound, "ヒーロー背景", IMAGE_FOLDER + "/hero.jpg"]];
      CATEGORIES.forEach((cat) => cat.items.forEach((it) =>
        rows.push([!!it.found, cat.title + "：" + it.name, IMAGE_FOLDER + "/" + cat.id + "/" + it.file + ".jpg"])));
      rows.push([!!FOOTER_EMBLEM.found, "フッター：校章", IMAGE_FOLDER + "/footer/" + FOOTER_EMBLEM.file + ".png"]);
      FOOTER_BANNERS.forEach((b) => rows.push([!!b.found, "フッター：" + b.label, IMAGE_FOLDER + "/footer/" + b.file + ".jpg"]));
      const ok = rows.filter((r) => r[0]).length;
      const box = document.createElement("div");
      box.style.cssText = "position:fixed;inset:0 auto 0 0;width:min(560px,100%);overflow:auto;z-index:9999;" +
        "background:rgba(0,0,0,.92);color:#fff;font:13px/1.7 monospace;padding:12px 14px;";
      box.innerHTML = `<button style="float:right" type="button">閉じる</button>
        <div><b>画像チェック：${ok} / ${rows.length} 件 見つかりました</b></div>
        <div style="opacity:.7">✖ は、その場所に画像が無い（またはファイル名・拡張子が違う）状態です</div><hr>` +
        rows.map((r) => `<div style="color:${r[0] ? "#8f8" : "#f99"}">${r[0] ? "✔" : "✖"} ${r[1]}` +
          `${r[0] ? "" : "<br>&nbsp;&nbsp;&nbsp;探す場所：" + r[2] + "（.png等も可）"}</div>`).join("");
      box.querySelector("button").addEventListener("click", () => box.remove());
      document.body.appendChild(box);
    }

    // ---------- ダーク／ライトモード（OS設定に自動追従） ----------
    // ページを開いたままOSのテーマを変えても、リロードなしで即座に切り替わります。
    const colorQuery = window.matchMedia("(prefers-color-scheme: dark)");
    function applyTheme(isDark) {
      document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
    }
    applyTheme(colorQuery.matches);
    if (colorQuery.addEventListener) {
      colorQuery.addEventListener("change", (e) => applyTheme(e.matches));
    } else {
      colorQuery.addListener((e) => applyTheme(e.matches)); // 古いSafari向け
    }

    // ---------- ヒーロー（最優先で読み込み → 完了してから演出開始） ----------
    // スクロールロックはありません。演出中でも、最初から自由に下へスクロールできます。
    const hero = document.getElementById("hero");
    const heroImg = document.getElementById("heroImg");
    const heroBlur = document.getElementById("heroBlur");      // 横長画面で左右を埋めるぼかし背景
    const titleVertical = document.querySelector(".title-vertical");
    const hint = document.getElementById("scrollHint");

    // リロードしても必ず最上部から始める（アニメーションも最初から再生される）
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    window.scrollTo({ top: 0, left: 0, behavior: "instant" });

    // スマホの「見える高さ」を測って --app-h に入れる（svh非対応のアプリ内ブラウザ用）。
    // アドレスバーの出入り（高さだけの変化）では更新せず、画像のチラつきを防ぐ
    let lastW = 0;
    function setAppHeight(force) {
      if (!force && window.innerWidth === lastW) return;
      lastW = window.innerWidth;
      document.documentElement.style.setProperty("--app-h", window.innerHeight + "px");
    }
    setAppHeight(true);
    window.addEventListener("resize", () => setAppHeight(false));

    // ヒーロー画像の読み込みが終わった（または失敗が確定した）ら解決される。団体画像の読み込みはこの後に始まる
    let heroReadyResolve;
    const heroReady = new Promise((resolve) => { heroReadyResolve = resolve; });

    // ★初期表示画像の優先読み込み（Preload）
    // 各カテゴリのカルーセルで「最初に画面内に出る画像」を、ヒーロー画像の読み込みが終わり次第、最優先で読み込んでおく。
    // カルーセルは先頭（1枚目）が中央に来る配置なので、最初に見えるのは
    //   PC　　：先頭を中心に左右2枚ずつ＝5枚（両端は見切れる）
    //   スマホ：先頭を中心に左右1枚ずつ＝3枚（両端は見切れる）
    // ループしているので、先頭の左側には末尾の団体が並びます。
    function initialItems(cat) {
      const n = cat.items.length;
      const reach = window.innerWidth <= MOBILE_MAX_WIDTH ? 1 : 2;
      const picked = [];
      for (let k = -reach; k <= reach; k++) {
        const it = cat.items[((k % n) + n) % n];
        if (!picked.includes(it)) picked.push(it);
      }
      return picked;
    }
    function preloadInitialImages() {
      const load = (src) => new Promise((resolve) => {
        const im = new Image();
        im.fetchPriority = "high";                              // 対応ブラウザでは、読み込みの優先度を高くする
        im.decoding = "async";
        im.onload = im.onerror = () => resolve();
        im.src = src;                                           // 読み込んだ画像はブラウザに保存され、後でカードに表示するときにすぐ出る
      });
      const jobs = [];
      CATEGORIES.forEach((cat) => initialItems(cat).forEach((it) => {
        jobs.push(resolveItemImage(cat, it).then((src) => (src ? load(src) : null)));
      }));
      return Promise.all(jobs);
    }
    const initialImagesReady = heroReady.then(preloadInitialImages);   // ヒーロー画像の読み込み後、すぐ開始
    let heroStarted = false;
    function startHeroAnimation() {
      if (heroStarted) return;
      heroStarted = true;
      heroReadyResolve();
      hero.classList.add("is-loaded");                       // 縦書きタイトルのフェードイン開始
      titleVertical.addEventListener("animationend", titleFinished);
      setTimeout(titleFinished, 2500);                       // 念のための保険（フェードインは約1.3秒で終わる）
    }

    // 縦書きタイトルの表示が完了した瞬間：サブタイトルのスライドインを始め、下の見出しボックス群の読み込みに進む
    let titleDone = false;
    function titleFinished() {
      if (titleDone) return;
      titleDone = true;
      hero.classList.add("is-title-done");                      // 横書きサブタイトルのスライドイン開始
      loadContent();                                            // ここから見出しボックス群の読み込み
    }

    // タイトル表示が終わったら、見出しボックス群（食バザー・展示…のカルーセル）を作る。
    // そのうえで、初期表示画像（上の initialImagesReady）の読み込みが済むのを待ち、
    // 「タイトル表示」と「初期表示画像の読み込み」の両方が完了した段階で、Scroll案内の表示とスクロール解禁を行う。
    // （画像の読み込みが長引いても、6秒たったら先へ進みます）
    async function loadContent() {
      try {
        buildCategories();                                       // 見出しボックス群を作る（描画）
        await Promise.race([initialImagesReady, new Promise((r) => setTimeout(r, 6000))]);
        await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));   // 描画が済むのを待つ
      } catch (e) { /* 失敗しても、スクロールできなくなることはない */ }
      loadFinished();
    }
    function loadFinished() {
      document.documentElement.classList.remove("is-locked");   // スクロール解禁
      showScrollHint();                                         // 大きな「Scroll」案内を表示
    }

    // 「Scroll ↓」：まだ一番上にいるときだけ表示。スクロールしたら消す
    let hintDone = false;
    function showScrollHint() {
      if (!hintDone && window.scrollY < 40) hint.classList.add("is-visible");
    }
    window.addEventListener("scroll", () => {
      if (window.scrollY > 40) { hintDone = true; hint.classList.remove("is-visible"); }
    }, { passive: true });
    hint.addEventListener("click", () => {
      document.getElementById("categories").scrollIntoView({ behavior: "smooth" });
    });

    // ぼかし背景は横長画面のときだけ読み込む（縦長のスマホでは無駄に読み込まない）
    const landscapeQuery = window.matchMedia("(min-aspect-ratio: 1 / 1)");
    function syncBlur() {
      if (landscapeQuery.matches && heroImg.naturalWidth && heroBlur.getAttribute("src") !== heroImg.src) {
        heroBlur.src = heroImg.src;
      }
    }
    if (landscapeQuery.addEventListener) landscapeQuery.addEventListener("change", syncBlur);

    let heroRetried = false;
    function heroLoaded() { syncBlur(); startHeroAnimation(); }
    function heroFailed() {
      if (heroRetried) { heroImg.hidden = true; startHeroAnimation(); return; }   // 駄目なら画像なし（グレーの背景）で演出だけ始める
      heroRetried = true;
      // images/hero.jpg が無い → 他の拡張子を探す → それも無ければ画像なし（グレーの背景）
      resolveHero().then((src) => {
        if (src) heroImg.src = src;
        else { heroImg.hidden = true; startHeroAnimation(); }
      });
    }
    heroImg.alt = "文化祭メイン画像";
    heroImg.addEventListener("load", heroLoaded);
    heroImg.addEventListener("error", heroFailed);
    if (HERO_IMAGE) heroImg.src = HERO_IMAGE;                  // URLを直接指定している場合
    else if (heroImg.complete) { heroImg.naturalWidth ? heroLoaded() : heroFailed(); }   // 既に読み込み済み／失敗済み
    setTimeout(startHeroAnimation, 8000);                      // 通信が極端に遅くても、8秒後には演出を始める保険（それまでスクロールは固定）

    // URLの末尾に ?imgcheck を付けて開いたときだけ、画像の確認結果を表示
    if (new URLSearchParams(location.search).has("imgcheck")) heroReady.then(showImageCheck);

  </script>
</body>
</html>
