<!DOCTYPE html>
<html lang="ja" class="is-locked">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">

  <!-- リロード・戻る操作でも、前回のスクロール位置を復元せず、必ず最上部から始める -->
  <script>if ("scrollRestoration" in history) history.scrollRestoration = "manual";</script>

  <!-- ★ヒーロー画像を最優先で読み込む（Preload）。画像の拡張子が .jpg 以外のときは、下の href と
       <img id="heroImg"> の src を合わせて変更してください（無い場合は自動で別の拡張子を探し、それも無ければ画像なし＝グレーの背景になります） -->
  <link rel="preload" as="image" href="images/hero.jpg" fetchpriority="high">
  <title>第64回 文化祭｜伝承華</title>

  <!-- Google Fonts：明朝体（Noto Serif JP） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;900&display=swap" rel="stylesheet">

  <style>
    /* ==================================================
       配色（ダーク／ライト）
       ★色を変えたいときはここの変数だけ編集すればOKです。
       OSのテーマ設定に自動で追従します（JavaScriptが <html data-theme="..."> を切り替え）。
    ================================================== */
    :root {
      color-scheme: dark light;
      /* ▼ ダークモード（初期値） */
      --ink: #15131a;          /* ページ背景 */
      --ink-soft: #1f1c27;     /* モーダルなどの背景 */
      --sakura: #e8a6b6;       /* アクセント色（桜） */
      --text: #ffffff;         /* 文字色 */
      --line: rgba(255, 255, 255, 0.5);       /* ボタンの枠線 */
      --card-border: rgba(255, 255, 255, 0.14); /* カードの枠線 */
      --card-w: 260px;           /* カードの幅（カルーセルはJSが画面幅から自動計算します） */
      --gap: 16px;               /* カード同士のすき間（スマホは下のmediaで10px） */
      --pad: clamp(1rem, 4vw, 3rem);          /* 左端の余白 */
    }

    /* ▼ ライトモード（JSで data-theme="light" が付いたとき） */
    :root[data-theme="light"] {
      color-scheme: light;
      --ink: #faf7f4;
      --ink-soft: #ffffff;
      --sakura: #b4415c;
      --text: #1d1a20;
      --line: rgba(0, 0, 0, 0.35);
      --card-border: rgba(0, 0, 0, 0.14);
    }
    /* ▼ JSが動く前の保険（OS設定がライトのとき）。上と同じ値にしてください */
    @media (prefers-color-scheme: light) {
      :root:not([data-theme]) {
        color-scheme: light;
        --ink: #faf7f4; --ink-soft: #ffffff; --sakura: #b4415c;
        --text: #1d1a20; --line: rgba(0, 0, 0, 0.35); --card-border: rgba(0, 0, 0, 0.14);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ★横スクロール（横揺れ）防止：画面幅を超えた部分は切り取る */
    html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }
    .hero, .categories, .category { max-width: 100%; overflow-x: hidden; }

    html { scroll-behavior: smooth; }

    body {
      font-family: "Noto Serif JP", "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
      background: var(--ink);
      color: var(--text);
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* スクロールを止める場合：
       ・is-locked   … ページを開いてから、縦書きタイトルの表示が完了するまで
       ・modal-open  … ポップアップ（モーダル）表示中 */
    html.is-locked, html.is-locked body,
    html.modal-open, html.modal-open body { overflow: hidden; }

    /* ==================================================
       1. ヒーローセクション
    ================================================== */
    .hero {
      position: relative;
      width: 100%;          /* 100vw だと縦スクロールバーの幅ぶんはみ出して横スクロールが出るため 100% にしています */
      /* 初回表示でヒーローだけが画面ぴったりに収まるようにする（アドレスバー・アプリ内ブラウザ対策）
         ① 100vh：古いブラウザ用  ② --app-h：JSで測った実際に見える高さ（LINE/Instagram等のアプリ内ブラウザ用）
         ③ 100svh：アドレスバーが出ている状態の高さ。アドレスバーの出入りでヒーローの大きさが
            変わらないので、画像のチラつきを防げます（dvh を使うとスクロール中に大きさが変わるため svh を採用） */
      height: 100vh;
      height: var(--app-h, 100vh);
      height: 100svh;
      overflow: hidden;
      background: #4a4a4a;   /* 背景画像が無いときのグレーの背景（空欄） */
    }

    /* ★背景画像：HTML内の <img class="hero__bg"> の src を差し替え */
    .hero__bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;         /* 縦長の画面（スマホ縦）は画面いっぱいに表示 */
      object-position: center;
      transform: translateZ(0);          /* GPUで描画してチラつきを防ぐ */
      backface-visibility: hidden;
    }

    /* 横長の画面（PC・スマホ横向き）：
       ① メイン画像は切り取らず、元の縦長のまま中央に表示（contain）
       ② 左右の空いたところには、同じ画像をぼかして拡大した背景（.hero__bg-blur）を敷く */
    .hero__bg-blur {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: blur(28px) brightness(0.85);   /* ぼかしの強さ・明るさはここで調整 */
      transform: scale(1.15) translateZ(0);  /* ぼかした縁が見えないよう少し拡大（GPU描画） */
      backface-visibility: hidden;
    }
    @media (min-aspect-ratio: 1 / 1) {
      .hero__bg { object-fit: contain; }
      .hero__bg-blur { display: block; }
    }

    .hero__content {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ① 縦書きメインタイトル */
    .title-vertical {
      writing-mode: vertical-rl;
      color: #fff;
      font-weight: 300;
      letter-spacing: 0.3em;
      line-height: 1.8;
      white-space: nowrap;             /* 勝手に折り返さない（改行はHTML内で指定した位置だけ） */
      padding: min(2.5rem, 4vh) min(1.8rem, 3vw);
      transform: translateZ(0);          /* GPUで描画してチラつきを防ぐ */
      backface-visibility: hidden;
      will-change: opacity;
      /* 背景ではなく影で文字を際立たせる（濃さ・広がりはここで調整） */
      text-shadow:
        0 0 4px rgba(0, 0, 0, 0.9),
        2px 2px 4px #000,
        -2px 2px 4px #000,
        0 0 12px rgba(0, 0, 0, 0.8),
        0 0 28px rgba(0, 0, 0, 0.6);
      opacity: 0;
    }
    /* 文字サイズは画面の幅(vw)と高さ(vh)の小さい方に合わせて自動で拡大・縮小します。
       clamp(最小, 可変, 最大)：数字を変えると大きさを調整できます */
    .title-vertical__main { display: block; white-space: nowrap; font-size: clamp(1.8rem, min(12vw, 12vh), 5.5rem); font-weight: 300; }
    .title-vertical__sub  { display: block; white-space: nowrap; font-size: clamp(0.65rem, min(5vw, 4.4vh), 1.6rem); font-weight: 200; }

    /* ② 横書きサブタイトル（画面左下） */
    .title-horizontal {
      position: absolute;
      left: clamp(1rem, 3vw, 3rem);
      bottom: clamp(1rem, 4vh, 2.5rem);
      color: #fff;
      font-weight: 900;
      font-size: clamp(0.9rem, min(4.2vw, 5vh), 1.8rem);   /* 画面に合わせて自動調整 */
      line-height: 1.3;
      letter-spacing: 0.08em;
      white-space: nowrap;
      backface-visibility: hidden;       /* GPUで描画してチラつきを防ぐ */
      will-change: transform, opacity;
      -webkit-text-stroke: 1px #000;
      paint-order: stroke fill;
      text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000,
                   0 2px 8px rgba(0, 0, 0, 0.5);
      opacity: 0;
    }

    /* 「Scroll ↓」案内（演出完了後に表示） */
    .scroll-hint {
      position: absolute;
      left: 50%;
      bottom: clamp(1rem, 4vh, 2.5rem);
      transform: translateX(-50%);
      background: none;
      border: 0;
      cursor: pointer;
      color: #fff;
      font-family: inherit;
      font-weight: 300;
      font-size: 1rem;
      letter-spacing: 0.2em;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }
    .scroll-hint.is-visible { opacity: 1; pointer-events: auto; }
    .scroll-hint span { display: inline-block; animation: bob 1.6s ease-in-out infinite; }

    /* アニメーションの流れ
       ① 背景画像の読み込み完了 → 縦書きタイトルが 1.1秒でフェードイン（0.2秒後に開始）
       ② 縦書きの表示が完了した瞬間（JSが .is-title-done を付ける）に、
          ・スクロール解禁  ・横書きサブタイトルが左からスライドイン  ・「Scroll ↓」表示 を同時に行う */
    .is-loaded .title-vertical        { animation: fadeIn 1.1s ease-out 0.2s forwards; }
    .is-title-done .title-horizontal  { animation: slideInFromLeft 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideInFromLeft {
      from { opacity: 0; transform: translateX(-150%); }  /* 画面の左外から（上下は動かない） */
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }

    /* ==================================================
       2. カテゴリ別カルーセル
    ================================================== */
    .categories {
      padding: clamp(3rem, 8vw, 6rem) 0 clamp(3rem, 8vw, 6rem);
    }

    .category { margin-bottom: clamp(2.5rem, 6vw, 4.5rem); }
    .category:last-child { margin-bottom: 0; }

    .category__head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      padding: 0 clamp(1rem, 4vw, 3rem);
      margin-bottom: 1rem;
    }
    .category__title {
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 400;
      letter-spacing: 0.12em;
      padding-left: 0.8rem;
      border-left: 3px solid var(--sakura);
    }
    .all-btn {
      background: none;
      border: 0;
      color: var(--sakura);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      cursor: pointer;
      white-space: nowrap;
      padding: 0.3rem 0;
      border-bottom: 1px solid transparent;
    }
    .all-btn:hover, .all-btn:focus-visible { border-bottom-color: var(--sakura); outline: none; }

    .carousel { position: relative; overflow: hidden; }

    /* 表示窓（横ドラッグは自前処理、縦スクロールはブラウザに任せる） */
    .carousel__viewport {
      overflow: hidden;
      touch-action: pan-y;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    .carousel__viewport.is-dragging { cursor: grabbing; }

    /* カードの並び（JavaScriptが transform で動かします） */
    .carousel__track {
      display: flex;
      gap: var(--gap);
      width: max-content;
      /* 左の余白は、中央のカードが真ん中に来るようJavaScriptが自動で設定します */
      will-change: transform;
      backface-visibility: hidden;
    }

    /* カード（ボックス） */
    .card {
      flex: 0 0 var(--card-w);
      margin: 0;
    }
    /* ▼ 画像の枠と比率が違うとき：画像は切らずに全体を表示し、余った上下／左右には
         同じ画像を「ぼかして拡大」した背景を敷く。背景の画像URL(--bg)は、画像の読み込み完了時にJSが設定します */
    .blurbg { position: relative; overflow: hidden; }
    .blurbg::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--bg) center / cover no-repeat;
      filter: blur(14px);                /* ぼかしの強さ */
      transform: scale(1.3);             /* ぼかした縁が見えないよう拡大 */
    }

    /* 画像の枠（団体名は画像に重ねず、この下に表示します） */
    .card__img {
      position: relative;
      aspect-ratio: 297 / 210;      /* A4横向き（297:210 ≒ 1.414:1）に固定。すべてのカード共通 */
      border: 1px solid var(--card-border);
      border-radius: 6px;
      overflow: hidden;
      background: #333;
    }
    .card__img img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;              /* 画像は切らずに全体を表示（余白はぼかし背景で埋める） */
      object-position: center;
      max-width: 100%;
      pointer-events: none;
      backface-visibility: hidden;
      opacity: 0;                       /* 読み込み完了まで非表示 → ふわっと表示（チラつき防止） */
      transition: opacity 0.35s ease;
    }
    .card__img img.is-ready { opacity: 1; }
    .nb { display: inline-block; white-space: nowrap; }   /* この中では折り返さない */
    /* 団体名・クラス名（画像の下）。色はダーク/ライトモードに自動で合わせます */
    .card__name {
      margin-top: 0.6rem;
      text-align: center;
      color: var(--text);
      font-weight: 300;
      font-size: clamp(1rem, 1.8vw, 1.3rem);
      letter-spacing: 0.1em;
      line-height: 1.5;
    }

    /* 左右ボタン */
    .carousel__btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      width: 2.8rem;
      height: 2.8rem;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-family: inherit;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .carousel__btn:hover, .carousel__btn:focus-visible { background: rgba(232, 166, 182, 0.85); outline: none; }
    .carousel__btn:disabled, .carousel__btn:disabled:hover { opacity: 0.3; cursor: default; background: rgba(0, 0, 0, 0.55); }
    /* 矢印ボタンは「画像」の高さの中央に置く（団体名の分は含めない） */
    .carousel .carousel__btn { top: calc(var(--card-w) * 0.3535); }   /* 画像の高さ(幅×210/297)の半分 */
    .carousel__btn--prev { left: clamp(0.4rem, 1.5vw, 1.2rem); }
    .carousel__btn--next { right: clamp(0.4rem, 1.5vw, 1.2rem); }

    /* ==================================================
       3. 「すべて表示」モーダル
    ================================================== */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.75);
    }
    .modal.is-open { display: flex; }
    .modal__panel {
      width: min(960px, 100%);
      max-height: 88vh;
      overflow-y: auto;
      background: var(--ink-soft);
      border-radius: 10px;
      padding: clamp(1.2rem, 3vw, 2rem);
    }
    .modal__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.2rem;
    }
    .modal__title {
      font-size: clamp(1.3rem, 3vw, 1.8rem);
      font-weight: 400;
      letter-spacing: 0.12em;
      padding-left: 0.8rem;
      border-left: 3px solid var(--sakura);
    }
    .modal__close {
      background: none;
      border: 1px solid var(--line);
      border-radius: 50%;
      width: 2.4rem;
      height: 2.4rem;
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
    }
    .modal__close:hover, .modal__close:focus-visible { background: rgba(128, 128, 128, 0.25); outline: none; }
    .modal__grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.8rem;
    }
    .modal__grid .card { flex: none; }
    /* 一覧のグループ見出し（体育館(ステージ)／中庭 など）。グリッド全幅を使う */
    .modal__group {
      grid-column: 1 / -1;
      margin-top: 0.8rem;
      padding-left: 0.6rem;
      border-left: 3px solid var(--sakura);
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      line-height: 1.4;
    }
    .modal__group:first-child { margin-top: 0; }

    /* スマホ表示（JS側の MOBILE_MAX_WIDTH と同じ値にしてください） */
    /* ==================================================
       団体の詳細ポップアップ
    ================================================== */
    .card { cursor: pointer; }
    .carousel__viewport .card { cursor: inherit; }   /* カルーセル内はドラッグ用の手のカーソル */
    .modal--detail { z-index: 110; }                  /* 一覧モーダルより手前に出す */
    .detail__panel { width: min(760px, 100%); }
    .detail__sub {
      margin: -0.4rem 0 0 calc(3px + 0.8rem);
      color: var(--sakura);
      font-size: 1rem;
      letter-spacing: 0.06em;
      line-height: 1.6;
    }
    .detail__text {
      margin-top: 1.4rem;
      font-size: 1.05rem;
      line-height: 2;
      letter-spacing: 0.04em;
      font-weight: 400;
    }
    /* 詳細ポップアップの画像：元の画像をそのまま表示（ぼかし・切り取りなし）。
       枠は画像の大きさに合わせて変わる。幅はポップアップいっぱいまで、高さは画面の70%まで */
    .detail__box { margin-top: 1.6rem; text-align: center; }
    .detail__img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 70vh;
      margin: 0 auto;
      border: 1px solid var(--card-border);
      border-radius: 6px;
    }
    .detail__img:not([src]) { display: none; }   /* 読み込み前は表示しない */

    @media (max-width: 767px) {
      :root { --gap: 10px; }
      /* 「＜すべて表示＞」の一覧：スマホでは2列で表示 */
      .modal__grid { grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
      .modal__grid .card__name { font-size: 0.95rem; letter-spacing: 0.05em; }
    }

    /* ==================================================
       フッター
    ================================================== */
    .footer {
      border-top: 1px solid var(--card-border);
      background: var(--ink-soft);
      padding: clamp(2rem, 6vw, 3.5rem) var(--pad) calc(clamp(1.5rem, 4vw, 2.5rem) + env(safe-area-inset-bottom, 0px));
    }
    .footer__inner { max-width: 1100px; margin: 0 auto; }
    /* 校章は学校名などの文字の上・中央。文字情報はすべて中央揃え */
    .footer__school {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(0.8rem, 2vw, 1.2rem);
      text-align: center;
    }
    .footer__emblem {
      flex: none;
      width: clamp(64px, 10vw, 88px);
      aspect-ratio: 1 / 1;
      object-fit: contain;               /* 校章は歪めず全体を表示 */
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .footer__emblem.is-ready { opacity: 1; }
    .footer__info { font-size: 0.95rem; line-height: 1.9; letter-spacing: 0.04em; text-align: center; }
    .footer__info a { color: inherit; }
    .footer__name { font-size: clamp(1.15rem, 2.4vw, 1.45rem); letter-spacing: 0.1em; line-height: 1.5; }
    .footer__name span { display: block; font-size: 0.8rem; letter-spacing: 0.04em; opacity: 0.8; }
    .footer__admin { margin-top: 0.4rem; font-size: 0.85rem; opacity: 0.85; }

    /* リンクバナー：PC=横並び／スマホ=縦並び。
       高さは --banner-h にそろえ、横幅は各バナー画像の縦横比に合わせて自動で決まる（余白・ぼかしなし） */
    .footer__banners {
      --banner-h: 46px;                  /* バナーの高さ。大きさを変えたいときはここ */
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.8rem;
      margin-top: clamp(1.8rem, 5vw, 2.8rem);
    }
    .footer__banners li { min-width: 0; max-width: 100%; }
    .footer__banners a {
      display: block;
      line-height: 0;                    /* 画像のまわりに余白が出ないようにする */
      border-radius: 0;                  /* 角は丸くしない（完全な長方形） */
      transition: outline-color 0.2s;
      outline: 2px solid transparent;
      outline-offset: 2px;
    }
    .footer__banners a:hover, .footer__banners a:focus-visible { outline-color: var(--sakura); }
    /* バナー画像が無いときは、グレーの空枠（リンクは使える） */

    /* ==================================================
       ★画像フォルダの設定（GitHubにアップロードする画像の置き場所）

       index.html と同じ場所に「images」フォルダを作り、次のように画像を置きます。

         images/
          ├─ hero.jpg          ← トップの大きな背景画像
          ├─ food/2-2.jpg      ← 食バザー 2年2組（food/2-4.jpg, 2-5 … と続く）
          ├─ exhibit/1-1.jpg   ← 展示
          ├─ stage/1-3.jpg     ← ステージ
          ├─ yushi/grows.jpg   ← 有志発表
          ├─ club/chemistry.jpg ← 部活動（ファイル名は各団体の file の値）
          └─ other/shop.jpg    ← その他団体

       ・ファイル名は半角英数字で、大文字小文字も正確に（GitHub Pagesは区別します）
       ・拡張子は .jpg .jpeg .png .webp（大文字の .JPG なども可）。画像が無い所は空欄（グレーの枠など）になります
       ・うまく表示されないときは、ページのURLの末尾に ?imgcheck を付けて開くと、
         どの画像が見つかり、どの画像が見つからないか（探している場所）が一覧で出ます
       ・画像は横幅1600px・1MB以下くらいに軽くしておくと表示が速くなります
    ================================================== */
    const IMAGE_FOLDER = "images";
    const IMAGE_EXTENSIONS = ["jpg", "jpeg", "png", "webp", "JPG", "JPEG", "PNG", "WEBP"];   // 探す拡張子（順番に試します）
    const HERO_IMAGE = "";                                     // 例: "https://…/top.jpg"（空なら images/hero.* を探す）

    /* ==================================================
       ★フッターの設定
       ■ 校章・バナー画像の差し替え（かんたん）：
           images/footer/emblem.png    ← 校章マーク
           images/footer/banner1.jpg 〜 banner5.jpg ← バナー（左から／上から順）
           （.jpg .jpeg .png .webp に対応／無ければ空欄）
         ※img にURLを書くと、そちらが優先されます。
       ■ リンク先：url を書き換える。label はバナーの説明（画像の代替テキスト）
    ================================================== */
    const FOOTER_EMBLEM = { file: "emblem", img: "" };
    const FOOTER_BANNERS = [
      { label: "熊本県立第二高等学校 公式サイト", url: "https://kumamoto-d2hs.ed.jp/",       file: "banner1", img: "" },
      { label: "Instagram（d2_daini）",           url: "https://www.instagram.com/d2_daini/", file: "banner2", img: "" },
      { label: "ビッグスカイ高校",                 url: "https://bigsky.mcpsmt.org/",          file: "banner3", img: "" },
      { label: "同窓会 りんどう会",                 url: "https://www.rindoukai.net/",          file: "banner4", img: "" },
      { label: "科学技術振興機構（JST）",           url: "https://www.jst.go.jp/",              file: "banner5", img: "" }
    ];

    /* 自動スライドの間隔（ミリ秒）。4000〜5000が目安 */
    const AUTO_SLIDE_MS = 4500;
    /* 自動スライドで1枚動くときの速さ（ミリ秒）。大きいほどゆっくり */
    const SLIDE_MS = 700;
    /* 「＜」「＞」ボタンを押したときの速さ（ミリ秒）。200〜300でスッと素早く動きます */
    const BUTTON_SLIDE_MS = 250;

    /* カルーセルの見え方
       端のカードがどれくらい見えるか（0.35 = 35%だけ見える＝65%が隠れる）。0.5未満で調整してください
       ・PC　 ：横5枚（中央＋左右の隣＋両端の見切れ）
       ・スマホ：横3枚（中央＋両端の見切れ） */
    const EDGE_VISIBLE = 0.35;
    /* この幅(px)以下をスマホ表示とみなす（CSSの max-width: 767px と合わせる） */
    const MOBILE_MAX_WIDTH = 767;

    /* ==================================================
       以下はプログラム本体（初心者の方は触らなくてOKです）
    ================================================== */

    // カードに表示する団体名のHTML。wrap があれば、| の位置でだけ折り返す（例：普通科 / 美術部）
    function nameHTML(item) {
      if (!item.wrap) return item.name;
      // 外側の <span> で包む（折り返し位置を | の所だけにするため）
      return "<span>" + item.wrap.split("|").map((part) => `<span class="nb">${part}</span>`).join("<wbr>") + "</span>";
    }

    // カード1枚分のHTMLを作る
    function cardHTML(item, cat, isClone, index) {
      // 画像の src は、近くに来たとき／ポップアップを開いたときに設定します（hydrateImages）
      const srcAttr = item.src ? ` src="${item.src}"` : "";
      return `<figure class="card" data-i="${index}"${isClone ? ' aria-hidden="true"' : ''}>
        <div class="card__img blurbg"><img${srcAttr} alt="" draggable="false" loading="lazy" decoding="async"></div>
        <figcaption class="card__name">${nameHTML(item)}</figcaption>
      </figure>`;
    }

    // ---------- 画像の自動検出（images フォルダにある画像を探す） ----------
    // 画像が読み込めるか確認（3秒で打ち切り）
    // 画像ファイルがあるか確認する。
    // ・通常（GitHub Pagesなど）は HEAD リクエストで「存在するか」だけ確認 → 画像が重くても待たない
    // ・パソコン上で index.html を直接開いた場合などは、実際に読み込んで確認（最大30秒待つ）
    async function probeImage(src) {
      if (location.protocol === "http:" || location.protocol === "https:") {
        try {
          const res = await fetch(src, { method: "HEAD", cache: "no-cache" });
          if (res.ok) return true;
          if (res.status !== 405 && res.status !== 501) return false;   // 404など＝無い
        } catch (e) { /* 通信エラーのときは下の方法で確認 */ }
      }
      return new Promise((resolve) => {
        const img = new Image();
        const timer = setTimeout(() => resolve(false), 30000);
        img.onload = () => { clearTimeout(timer); resolve(true); };
        img.onerror = () => { clearTimeout(timer); resolve(false); };
        img.src = src;
      });
    }
    // images/フォルダ/ファイル名.拡張子 を順に探す。見つからなければ ""
    async function findImage(folder, file) {
      for (const ext of IMAGE_EXTENSIONS) {
        const src = [IMAGE_FOLDER, folder, encodeURIComponent(file)].filter(Boolean).join("/") + "." + ext;
        if (await probeImage(src)) return src;
      }
      return "";
    }
    // 団体1件の画像を決める（必要になったときに1回だけ）：img指定 → imagesフォルダ。どちらも無ければ空欄（画像なし）
    function resolveItemImage(cat, item) {
      if (!item._p) {
        item._p = (async () => {
          item.found = item.img || (item.file ? await findImage(cat.id, item.file) : "");   // 見つかった画像（無ければ ""）
          item.src = item.found;                      // 画像が無いときは "" のまま（仮画像は出さない）
          return item.src;
        })();
      }
      return item._p;
    }
    // コンテナ内のカード画像に、実際の src を設定する（まだ設定されていないものだけ）
    function hydrateImages(container, cat) {
      container.querySelectorAll(".card").forEach((card) => {
        const img = card.querySelector("img");
        if (!img || img.getAttribute("src")) return;
        resolveItemImage(cat, cat.items[Number(card.dataset.i)]).then((src) => {
          if (src && !img.getAttribute("src")) img.src = src;      // 画像が無いときは何もしない（空の枠のまま）
        });
      });
    }
    // 画面の近くに来たら fn を1回だけ実行する（ヒーロー画像の読み込みが終わってから）
    function whenNear(el, fn) {
      if (!("IntersectionObserver" in window)) { fn(); return; }
      const io = new IntersectionObserver((entries) => {
        if (!entries.some((e) => e.isIntersecting)) return;
        io.disconnect();
        heroReady.then(fn);
      }, { rootMargin: "600px 0px" });   // 画面の600px手前から読み込み開始
      io.observe(el);
    }
    // 画像の読み込みが終わったら is-ready を付けて、ふわっと表示する
    // あわせて、枠（.blurbg）と画像の縦横比が違うときは、同じ画像をぼかして背景に敷く（--bg を設定）
    document.addEventListener("load", (e) => {
      const img = e.target;
      if (img.tagName !== "IMG") return;
      img.classList.add("is-ready");
      const box = img.closest(".blurbg");
      if (!box || !img.naturalWidth) return;
      const boxRatio = box.clientHeight ? box.clientWidth / box.clientHeight : 0;
      const imgRatio = img.naturalWidth / img.naturalHeight;
      if (boxRatio && Math.abs(imgRatio / boxRatio - 1) < 0.04) { box.style.removeProperty("--bg"); return; }   // ほぼ同じ比率なら背景は不要
      box.style.setProperty("--bg", `url("${img.currentSrc || img.src}")`);
    }, true);

    // ヒーロー（背景）画像を決める：HERO_IMAGE → images/hero.*。無ければ ""（空）
    async function resolveHero() {
      return HERO_IMAGE || (await findImage("", "hero"));
    }

    // ---------- カテゴリセクションの生成 ----------
    const root = document.getElementById("categories");

    function buildCategories() {
    CATEGORIES.forEach((cat) => {
      const sec = document.createElement("section");
      sec.className = "category";
      sec.id = "cat-" + cat.id;
      sec.innerHTML = `
        <div class="category__head">
          <h2 class="category__title">${cat.title}</h2>
          <button class="all-btn" type="button">＜すべて表示＞</button>
        </div>
        <div class="carousel">
          <button class="carousel__btn carousel__btn--prev" type="button" aria-label="前へ">＜</button>
          <div class="carousel__viewport"><div class="carousel__track"></div></div>
          <button class="carousel__btn carousel__btn--next" type="button" aria-label="次へ">＞</button>
        </div>`;
      root.appendChild(sec);

      const carousel = sec.querySelector(".carousel");
      setupCarousel(carousel, cat);
      sec.querySelector(".all-btn").addEventListener("click", () => openModal(cat));
      // この部門の画像は、画面の近くに来てから読み込む（初期表示を軽くするため）
      whenNear(sec, () => {
        carousel._active = true;
        hydrateImages(carousel.querySelector(".carousel__track"), cat);
      });
    });
    }

    // ---------- 無限ループ・カルーセルの動作 ----------
    // 仕組み：団体カードを前後に複製（クローン）して並べ、
    //         位置が1セット分ずれたら見た目が変わらないまま元の位置へ戻す → 途切れずに回り続けます。
    function setupCarousel(carousel, cat) {
      const viewport = carousel.querySelector(".carousel__viewport");
      const track = carousel.querySelector(".carousel__track");
      const prev = carousel.querySelector(".carousel__btn--prev");
      const next = carousel.querySelector(".carousel__btn--next");
      const n = cat.items.length;
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

      let step = 0;   // カード1枚ぶんの移動量（カード幅＋すき間）
      let setW = 0;   // 団体カード1セットぶんの幅
      let base = 0;   // 本物（中央セット）の先頭位置
      let pos = 0;    // 現在のスクロール位置(px)
      let tween = null, raf = 0;

      const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
      const easeOut = (t) => 1 - Math.pow(1 - t, 3);
      const setHTML = (isClone) => cat.items.map((it, i) => cardHTML(it, cat, isClone, i)).join("");
      const render = () => { track.style.transform = `translate3d(${-pos}px,0,0)`; };
      const snap = (p) => base + Math.round((p - base) / step) * step;

      // カードを並べ直す（最初と画面サイズ変更時）。index=先頭に表示する団体の番号
      function build(index) {
        const V = carousel.clientWidth;                          // カルーセルの表示幅
        const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
        // 端のカードが EDGE_VISIBLE だけ見える大きさを逆算（PC=横5枚 / スマホ=横3枚）
        const mobile = window.innerWidth <= MOBILE_MAX_WIDTH;
        const cardW = mobile
          ? (V / 2 - gap) / (0.5 + EDGE_VISIBLE)
          : (V / 2 - 2 * gap) / (1.5 + EDGE_VISIBLE);
        carousel.style.setProperty("--card-w", cardW + "px");
        track.style.marginLeft = (V - cardW) / 2 + "px";         // 中央のカードを画面の真ん中へ
        step = cardW + gap;
        setW = step * n;
        const copies = Math.ceil(V / setW) + 1;                  // 左右に必要なクローン数
        let html = "";
        for (let i = 0; i < copies * 2 + 1; i++) html += setHTML(i !== copies);
        track.innerHTML = html;
        if (carousel._active) hydrateImages(track, cat);        // 並べ直したときも画像を設定
        base = copies * setW;
        pos = base + index * step;
        tween = null;
        render();
      }

      // 位置が中央セットの外に出たら、1セットぶん戻す（見た目は変わらない）。戻した量を返す
      function wrap() {
        let d = 0;
        while (pos >= base + setW) { pos -= setW; d -= setW; }
        while (pos < base) { pos += setW; d += setW; }
        if (d && tween) { tween.from += d; tween.to += d; }
        return d;
      }

      // なめらかに target 位置まで動かす
      function animateTo(target, dur, ease) {
        tween = { from: pos, to: target, t0: performance.now(), dur: reduceMotion ? 1 : dur, ease };
        if (!raf) raf = requestAnimationFrame(tick);
      }
      function tick(now) {
        raf = 0;
        if (!tween) return;
        const t = Math.min(1, Math.max(0, (now - tween.t0) / tween.dur));
        pos = tween.from + (tween.to - tween.from) * tween.ease(t);
        wrap();
        render();
        if (t < 1) raf = requestAnimationFrame(tick); else tween = null;
      }

      // dir: 1=次へ / -1=前へ（常に1枚ずつ）
      function slideBy(dir, dur = SLIDE_MS, ease = easeInOut) {
        const cur = tween ? tween.to : snap(pos);
        animateTo(cur + dir * step, dur, ease);
      }

      // ボタン操作：素早くスッと動かし、自動再生のタイマーをリセット
      prev.addEventListener("click", () => { slideBy(-1, BUTTON_SLIDE_MS, easeOut); start(); });
      next.addEventListener("click", () => { slideBy(1, BUTTON_SLIDE_MS, easeOut); start(); });

      // オートスライド（マウスを乗せている間・ドラッグ中は停止）
      let timer = null, hovering = false, dragging = false;
      const stop = () => { clearInterval(timer); timer = null; };
      // ポップアップ（詳細／一覧）が開いている間は、自動再生しない
      const modalIsOpen = () => document.documentElement.classList.contains("modal-open");
      const start = () => {
        stop();
        if (!hovering && !modalIsOpen()) {
          timer = setInterval(() => { if (!dragging && !document.hidden && !modalIsOpen()) slideBy(1); }, AUTO_SLIDE_MS);
        }
      };
      // ポップアップが開いたら一時停止、閉じたら自動で再開（modalstate は下の updateScrollLock が送る合図）
      document.addEventListener("modalstate", (e) => { if (e.detail.open) stop(); else start(); });
      carousel.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") { hovering = true; stop(); } });
      carousel.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") { hovering = false; start(); } });

      // マウスドラッグ／タッチスワイプ（Pointer Events で共通処理）
      let startX = 0, startPos = 0, lastX = 0, lastT = 0, vel = 0, moved = false;
      viewport.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        dragging = true;
        tween = null;
        startX = lastX = e.clientX;
        startPos = pos;
        lastT = performance.now();
        vel = 0;
        moved = false;
        viewport.setPointerCapture(e.pointerId);
        viewport.classList.add("is-dragging");
        stop();
      });
      viewport.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        if (Math.abs(e.clientX - startX) > 6) moved = true;   // 6px以上動いたらタップではなくドラッグ
        const now = performance.now();
        const dt = now - lastT;
        if (dt > 0) vel = vel * 0.6 + ((lastX - e.clientX) / dt) * 0.4;   // 指/マウスの勢い(px/ms)
        lastX = e.clientX;
        lastT = now;
        pos = startPos - (e.clientX - startX);
        startPos += wrap();
        render();
      });
      const endDrag = (e) => {
        if (!dragging) return;
        dragging = false;
        viewport.classList.remove("is-dragging");
        const isTap = !moved && e.type === "pointerup";
        // ドラッグなら勢いを加味して近いカードに揃える／タップならその場に留める
        animateTo(snap(isTap ? pos : pos + vel * 200), 500, easeOut);
        start();
        if (isTap) {
          // タップ：指/マウスの下にあるカードの詳細ポップアップを開く
          const el = document.elementFromPoint(e.clientX, e.clientY);
          const card = el && el.closest(".card");
          if (card && card.dataset.i !== undefined) openDetail(cat, cat.items[Number(card.dataset.i)]);
        }
      };
      viewport.addEventListener("pointerup", endDrag);
      viewport.addEventListener("pointercancel", endDrag);

      // 画面サイズが変わったら並べ直す
      let resizeTimer = null;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          const idx = ((Math.round((pos - base) / step) % n) + n) % n;
          build(idx);
        }, 150);
      });

      build(0);
      start();
    }

    
    // ---------- ポップアップ（一覧モーダル／詳細モーダル） ----------
    const modal = document.getElementById("modal");           // 「すべて表示」の一覧
    const modalTitle = document.getElementById("modalTitle");
    const modalGrid = document.getElementById("modalGrid");
    const modalClose = document.getElementById("modalClose");
    const detail = document.getElementById("detail");         // 団体の詳細
    const detailTitle = document.getElementById("detailTitle");
    const detailSub = document.getElementById("detailSub");
    const detailText = document.getElementById("detailText");
    const detailImg = document.getElementById("detailImg");
    const detailClose = document.getElementById("detailClose");
    let modalFocus = null, detailFocus = null, modalCat = null, currentDetail = null;

    // どれかのポップアップが開いている間は、背景をスクロールさせない
    function updateScrollLock() {
      const anyOpen = modal.classList.contains("is-open") || detail.classList.contains("is-open");
      document.documentElement.classList.toggle("modal-open", anyOpen);
      document.dispatchEvent(new CustomEvent("modalstate", { detail: { open: anyOpen } }));   // カルーセルの自動再生を止める／再開する合図
    }

    // 一覧モーダル（その部門の全団体をグリッド表示）
    function openModal(cat) {
      modalFocus = document.activeElement;
      modalCat = cat;
      modalTitle.textContent = cat.title;
      if (cat.groups) {
        // グループ分けあり：サブタイトル → その団体のカード、の順に並べる
        const used = new Set();
        const cardOf = (name) => {
          const i = cat.items.findIndex((it) => it.name === name);
          return i < 0 ? "" : cardHTML(cat.items[i], cat, false, i);
        };
        let html = cat.groups.map((g) => {
          g.names.forEach((n) => used.add(n));
          return `<h3 class="modal__group">${g.title}</h3>` + g.names.map(cardOf).join("");
        }).join("");
        html += cat.items.map((it, i) => (used.has(it.name) ? "" : cardHTML(it, cat, false, i))).join("");   // groupsに無い団体は最後に
        modalGrid.innerHTML = html;
      } else {
        modalGrid.innerHTML = cat.items.map((it, i) => cardHTML(it, cat, false, i)).join("");
      }
      modalGrid.querySelectorAll(".card").forEach((c) => { c.setAttribute("role", "button"); c.tabIndex = 0; });
      hydrateImages(modalGrid, cat);                         // 一覧を開いたときに初めて画像を読み込む
      modal.classList.add("is-open");
      updateScrollLock();
      modalClose.focus();
    }
    function closeModal() {
      modal.classList.remove("is-open");
      updateScrollLock();
      if (modalFocus) modalFocus.focus();
    }

    // 詳細モーダル：上＝団体名（＋企画名）／中＝紹介文／下＝画像 の順
    function openDetail(cat, item) {
      detailFocus = document.activeElement;
      detailTitle.textContent = item.name;
      detailSub.textContent = item.title || "";
      detailSub.hidden = !item.title;
      detailText.textContent = item.text || "";
      // 詳細の大きな画像は、ポップアップを開いたときに初めて読み込む
      currentDetail = item;
      detailImg.parentElement.style.removeProperty("--bg");   // 前の画像のぼかし背景を消す
      const detailBox = detailImg.parentElement;
      detailBox.hidden = true;                                  // 画像が無いときは、画像の枠ごと表示しない
      detailImg.removeAttribute("src");
      resolveItemImage(cat, item).then((src) => {
        if (currentDetail === item && src) { detailBox.hidden = false; detailImg.src = src; }
      });
      detailImg.alt = item.name + "の画像";
      detail.classList.add("is-open");
      detail.querySelector(".modal__panel").scrollTop = 0;
      updateScrollLock();
      detailClose.focus();
    }
    function closeDetail() {
      detail.classList.remove("is-open");
      updateScrollLock();
      if (detailFocus) detailFocus.focus();
    }

    modalClose.addEventListener("click", closeModal);
    detailClose.addEventListener("click", closeDetail);
    modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });     // 背景クリックで閉じる
    detail.addEventListener("click", (e) => { if (e.target === detail) closeDetail(); });

    // 一覧の中のカードをクリック（またはEnter）→ 詳細モーダル
    modalGrid.addEventListener("click", (e) => {
      const card = e.target.closest(".card");
      if (card && modalCat) openDetail(modalCat, modalCat.items[Number(card.dataset.i)]);
    });
    modalGrid.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const card = e.target.closest(".card");
      if (card && modalCat) { e.preventDefault(); openDetail(modalCat, modalCat.items[Number(card.dataset.i)]); }
    });

    // Escキー：いちばん手前のポップアップから閉じる
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      if (detail.classList.contains("is-open")) closeDetail();
      else if (modal.classList.contains("is-open")) closeModal();
    });

    // ---------- 並び順（自動）----------
    // ・「2年2組」のような学年つきクラス：2年 → 1年、同じ学年の中は組順（1,2,… → A → S）
    // ・それ以外の団体：yomi（ひらがな）の50音順
    // ・クラスとそれ以外が同じカテゴリにあるときは、クラスが先
    function classKey(item) {
      const m = item.name.match(/^(\d)年(.+)組$/);
      if (!m) return null;
      return { grade: Number(m[1]), kumi: /^\d+$/.test(m[2]) ? Number(m[2]) : 1000 + m[2].charCodeAt(0) };
    }
    const jaCollator = new Intl.Collator("ja");
    function compareItems(a, b) {
      const ka = classKey(a), kb = classKey(b);
      if (ka && kb) return (kb.grade - ka.grade) || (ka.kumi - kb.kumi);
      if (ka) return -1;
      if (kb) return 1;
      return jaCollator.compare(a.yomi || a.name, b.yomi || b.name);
    }
    CATEGORIES.forEach((cat) => {
      cat.items.sort(compareItems);
      (cat.groups || []).forEach((g) => {
        const byName = (n) => cat.items.find((it) => it.name === n) || { name: n };
        g.names.sort((x, y) => compareItems(byName(x), byName(y)));
      });
    });

    // ---------- 表示の組み立て ----------
    // カードの枠は先に作り、画像は「画面の近くに来たとき」に読み込みます（初期表示を軽くするため）
    buildCategories();

    // ---------- フッター（校章・リンクバナー） ----------
    // バナーのリンクを作る（画像は近くに来てから読み込む）
    document.getElementById("footerBanners").innerHTML = FOOTER_BANNERS.map((b) =>
      `<li><a href="${b.url}" target="_blank" rel="noopener noreferrer" aria-label="${b.label}"><img alt="${b.label}" loading="lazy" decoding="async"></a></li>`
    ).join("");
    // 校章・バナー画像を決めて設定する：img指定 → images/footer/。無ければ、校章は非表示・バナーはグレーの空枠
    async function loadFooterImages() {
      const emblem = document.getElementById("footerEmblem");
      const imgs = document.querySelectorAll("#footerBanners img");
      const set = async (obj, imgEl, onNone) => {
        obj.found = obj.img || await findImage("footer", obj.file);
        if (obj.found) imgEl.src = obj.found; else onNone();
      };
      await Promise.all([
        set(FOOTER_EMBLEM, emblem, () => { emblem.style.display = "none"; }),
        ...FOOTER_BANNERS.map((b, i) => set(b, imgs[i], () => imgs[i].closest("a").classList.add("is-empty")))
      ]);
    }
    whenNear(document.getElementById("footer"), loadFooterImages);

    // ---------- 画像チェック表示（?imgcheck） ----------
    // 見つかった画像（✔）と、見つからなかった画像（✖：探している場所）を一覧にします
    async function showImageCheck() {
      const jobs = [];
      CATEGORIES.forEach((cat) => cat.items.forEach((it) => jobs.push(resolveItemImage(cat, it))));
      jobs.push(loadFooterImages());
      await Promise.all(jobs);
      const heroFound = heroImg.naturalWidth > 0;
      const rows = [[heroFound, "ヒーロー背景", IMAGE_FOLDER + "/hero.jpg"]];
      CATEGORIES.forEach((cat) => cat.items.forEach((it) =>
        rows.push([!!it.found, cat.title + "：" + it.name, IMAGE_FOLDER + "/" + cat.id + "/" + it.file + ".jpg"])));
      rows.push([!!FOOTER_EMBLEM.found, "フッター：校章", IMAGE_FOLDER + "/footer/" + FOOTER_EMBLEM.file + ".png"]);
      FOOTER_BANNERS.forEach((b) => rows.push([!!b.found, "フッター：" + b.label, IMAGE_FOLDER + "/footer/" + b.file + ".jpg"]));
      const ok = rows.filter((r) => r[0]).length;
      const box = document.createElement("div");
      box.style.cssText = "position:fixed;inset:0 auto 0 0;width:min(560px,100%);overflow:auto;z-index:9999;" +
        "background:rgba(0,0,0,.92);color:#fff;font:13px/1.7 monospace;padding:12px 14px;";
      box.innerHTML = `<button style="float:right" type="button">閉じる</button>
        <div><b>画像チェック：${ok} / ${rows.length} 件 見つかりました</b></div>
        <div style="opacity:.7">✖ は、その場所に画像が無い（またはファイル名・拡張子が違う）状態です</div><hr>` +
        rows.map((r) => `<div style="color:${r[0] ? "#8f8" : "#f99"}">${r[0] ? "✔" : "✖"} ${r[1]}` +
          `${r[0] ? "" : "<br>&nbsp;&nbsp;&nbsp;探す場所：" + r[2] + "（.png等も可）"}</div>`).join("");
      box.querySelector("button").addEventListener("click", () => box.remove());
      document.body.appendChild(box);
    }

    // ---------- ダーク／ライトモード（OS設定に自動追従） ----------
    // ページを開いたままOSのテーマを変えても、リロードなしで即座に切り替わります。
    const colorQuery = window.matchMedia("(prefers-color-scheme: dark)");
    function applyTheme(isDark) {
      document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
    }
    applyTheme(colorQuery.matches);
    if (colorQuery.addEventListener) {
      colorQuery.addEventListener("change", (e) => applyTheme(e.matches));
    } else {
      colorQuery.addListener((e) => applyTheme(e.matches)); // 古いSafari向け
    }

    // ---------- ヒーロー（最優先で読み込み → 完了してから演出開始） ----------
    // スクロールロックはありません。演出中でも、最初から自由に下へスクロールできます。
    const hero = document.getElementById("hero");
    const heroImg = document.getElementById("heroImg");
    const heroBlur = document.getElementById("heroBlur");      // 横長画面で左右を埋めるぼかし背景
    const titleVertical = document.querySelector(".title-vertical");
    const hint = document.getElementById("scrollHint");

    // リロードしても必ず最上部から始める（アニメーションも最初から再生される）
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    window.scrollTo({ top: 0, left: 0, behavior: "instant" });

    // スマホの「見える高さ」を測って --app-h に入れる（svh非対応のアプリ内ブラウザ用）。
    // アドレスバーの出入り（高さだけの変化）では更新せず、画像のチラつきを防ぐ
    let lastW = 0;
    function setAppHeight(force) {
      if (!force && window.innerWidth === lastW) return;
      lastW = window.innerWidth;
      document.documentElement.style.setProperty("--app-h", window.innerHeight + "px");
    }
    setAppHeight(true);
    window.addEventListener("resize", () => setAppHeight(false));

    // ヒーロー画像の読み込みが終わった（または失敗が確定した）ら解決される。団体画像の読み込みはこの後に始まる
    let heroReadyResolve;
    const heroReady = new Promise((resolve) => { heroReadyResolve = resolve; });
    let heroStarted = false;
    function startHeroAnimation() {
      if (heroStarted) return;
      heroStarted = true;
      heroReadyResolve();
      hero.classList.add("is-loaded");                       // 縦書きタイトルのフェードイン開始
      titleVertical.addEventListener("animationend", titleFinished);
      setTimeout(titleFinished, 2500);                       // 念のための保険（フェードインは約1.3秒で終わる）
    }

    // 縦書きタイトルの表示が完了した瞬間：スクロール解禁 ＋ サブタイトルと「Scroll ↓」を同時に表示
    let titleDone = false;
    function titleFinished() {
      if (titleDone) return;
      titleDone = true;
      document.documentElement.classList.remove("is-locked");   // スクロール解禁（以降は演出中もスクロール可能）
      hero.classList.add("is-title-done");                      // 横書きサブタイトルのスライドイン開始
      showScrollHint();                                         // 「Scroll ↓」を表示
    }

    // 「Scroll ↓」：まだ一番上にいるときだけ表示。スクロールしたら消す
    let hintDone = false;
    function showScrollHint() {
      if (!hintDone && window.scrollY < 40) hint.classList.add("is-visible");
    }
    window.addEventListener("scroll", () => {
      if (window.scrollY > 40) { hintDone = true; hint.classList.remove("is-visible"); }
    }, { passive: true });
    hint.addEventListener("click", () => {
      document.getElementById("categories").scrollIntoView({ behavior: "smooth" });
    });

    // ぼかし背景は横長画面のときだけ読み込む（縦長のスマホでは無駄に読み込まない）
    const landscapeQuery = window.matchMedia("(min-aspect-ratio: 1 / 1)");
    function syncBlur() {
      if (landscapeQuery.matches && heroImg.naturalWidth && heroBlur.getAttribute("src") !== heroImg.src) {
        heroBlur.src = heroImg.src;
      }
    }
    if (landscapeQuery.addEventListener) landscapeQuery.addEventListener("change", syncBlur);

    let heroRetried = false;
    function heroLoaded() { syncBlur(); startHeroAnimation(); }
    function heroFailed() {
      if (heroRetried) { heroImg.hidden = true; startHeroAnimation(); return; }   // 駄目なら画像なし（グレーの背景）で演出だけ始める
      heroRetried = true;
      // images/hero.jpg が無い → 他の拡張子を探す → それも無ければ画像なし（グレーの背景）
      resolveHero().then((src) => {
        if (src) heroImg.src = src;
        else { heroImg.hidden = true; startHeroAnimation(); }
      });
    }
    heroImg.alt = "文化祭メイン画像";
    heroImg.addEventListener("load", heroLoaded);
    heroImg.addEventListener("error", heroFailed);
    if (HERO_IMAGE) heroImg.src = HERO_IMAGE;                  // URLを直接指定している場合
    else if (heroImg.complete) { heroImg.naturalWidth ? heroLoaded() : heroFailed(); }   // 既に読み込み済み／失敗済み
    setTimeout(startHeroAnimation, 8000);                      // 通信が極端に遅くても、8秒後には演出を始める保険（それまでスクロールは固定）

    // URLの末尾に ?imgcheck を付けて開いたときだけ、画像の確認結果を表示
    if (new URLSearchParams(location.search).has("imgcheck")) heroReady.then(showImageCheck);
  </script>
</body>
</html>
