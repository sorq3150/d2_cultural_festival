<!DOCTYPE html>
<html lang="ja" class="is-locked">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>第64回 文化祭｜伝承華</title>

  <!-- Google Fonts：明朝体（Noto Serif JP） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;700;900&display=swap" rel="stylesheet">

  <style>
    /* ==================================================
       配色（ダーク／ライト）
       ★色を変えたいときはここの変数だけ編集すればOKです。
       OSのテーマ設定に自動で追従します（JavaScriptが <html data-theme="..."> を切り替え）。
    ================================================== */
    :root {
      color-scheme: dark light;
      /* ▼ ダークモード（初期値） */
      --ink: #15131a;          /* ページ背景 */
      --ink-soft: #1f1c27;     /* モーダル・マップ枠の背景 */
      --sakura: #e8a6b6;       /* アクセント色（桜） */
      --text: #ffffff;         /* 文字色 */
      --line: rgba(255, 255, 255, 0.5);       /* ボタンの枠線 */
      --card-border: rgba(255, 255, 255, 0.14); /* カード・マップの枠線 */
      --card-w: 260px;           /* カードの幅（カルーセルはJSが画面幅から自動計算します） */
      --gap: 16px;               /* カード同士のすき間（スマホは下のmediaで10px） */
      --pad: clamp(1rem, 4vw, 3rem);          /* 左端の余白 */
    }

    /* ▼ ライトモード（JSで data-theme="light" が付いたとき） */
    :root[data-theme="light"] {
      color-scheme: light;
      --ink: #faf7f4;
      --ink-soft: #ffffff;
      --sakura: #b4415c;
      --text: #1d1a20;
      --line: rgba(0, 0, 0, 0.35);
      --card-border: rgba(0, 0, 0, 0.14);
    }
    /* ▼ JSが動く前の保険（OS設定がライトのとき）。上と同じ値にしてください */
    @media (prefers-color-scheme: light) {
      :root:not([data-theme]) {
        color-scheme: light;
        --ink: #faf7f4; --ink-soft: #ffffff; --sakura: #b4415c;
        --text: #1d1a20; --line: rgba(0, 0, 0, 0.35); --card-border: rgba(0, 0, 0, 0.14);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ★横スクロール（横揺れ）防止：画面幅を超えた部分は切り取る */
    html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
    @supports (overflow: clip) { html, body { overflow-x: clip; } }
    .hero, .categories, .category, .map { max-width: 100%; overflow-x: hidden; }

    html { scroll-behavior: smooth; }

    body {
      font-family: "Noto Serif JP", "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
      background: var(--ink);
      color: var(--text);
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* スクロールロック（ヒーロー演出中・モーダル表示中） */
    html.is-locked, html.is-locked body,
    html.modal-open, html.modal-open body { overflow: hidden; }

    /* ==================================================
       1. ヒーローセクション
    ================================================== */
    .hero {
      position: relative;
      width: 100%;          /* 100vw だと縦スクロールバーの幅ぶんはみ出して横スクロールが出るため 100% にしています */
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* ★背景画像：HTML内の <img class="hero__bg"> の src を差し替え */
    .hero__bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;   /* 縦長の画面（スマホ縦）は中央を表示 */
    }
    /* 横長の画面（PC・スマホ横向き）：キャラクターの顔が映る高さに自動調整します。
       正確な位置はJavaScript（HERO_FOCUS_Y）が計算します。下はJSが動くまでの仮の値です */
    @media (min-aspect-ratio: 1 / 1) {
      .hero__bg { object-position: center 22%; }
    }

    .hero__content {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ① 縦書きメインタイトル */
    .title-vertical {
      writing-mode: vertical-rl;
      color: #fff;
      font-weight: 300;
      letter-spacing: 0.3em;
      line-height: 1.8;
      white-space: nowrap;             /* 勝手に折り返さない（改行はHTML内で指定した位置だけ） */
      padding: min(2.5rem, 4vh) min(1.8rem, 3vw);
      /* 背景ではなく影で文字を際立たせる（濃さ・広がりはここで調整） */
      text-shadow:
        0 0 4px rgba(0, 0, 0, 0.9),
        2px 2px 4px #000,
        -2px 2px 4px #000,
        0 0 12px rgba(0, 0, 0, 0.8),
        0 0 28px rgba(0, 0, 0, 0.6);
      opacity: 0;
    }
    /* 文字サイズは画面の幅(vw)と高さ(vh)の小さい方に合わせて自動で拡大・縮小します。
       clamp(最小, 可変, 最大)：数字を変えると大きさを調整できます */
    .title-vertical__main { display: block; white-space: nowrap; font-size: clamp(1.8rem, min(12vw, 12vh), 5.5rem); font-weight: 300; }
    .title-vertical__sub  { display: block; white-space: nowrap; font-size: clamp(0.65rem, min(5vw, 4.4vh), 1.6rem); font-weight: 200; }

    /* ② 横書きサブタイトル（画面左下） */
    .title-horizontal {
      position: absolute;
      left: clamp(1rem, 3vw, 3rem);
      bottom: clamp(1rem, 4vh, 2.5rem);
      color: #fff;
      font-weight: 900;
      font-size: clamp(0.9rem, min(4.2vw, 5vh), 1.8rem);   /* 画面に合わせて自動調整 */
      line-height: 1.3;
      letter-spacing: 0.08em;
      white-space: nowrap;
      -webkit-text-stroke: 1px #000;
      paint-order: stroke fill;
      text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000,
                   0 2px 8px rgba(0, 0, 0, 0.5);
      opacity: 0;
    }

    /* 「Scroll ↓」案内（演出完了後に表示） */
    .scroll-hint {
      position: absolute;
      left: 50%;
      bottom: clamp(1rem, 4vh, 2.5rem);
      transform: translateX(-50%);
      background: none;
      border: 0;
      cursor: pointer;
      color: #fff;
      font-family: inherit;
      font-weight: 300;
      font-size: 1rem;
      letter-spacing: 0.2em;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }
    .scroll-hint.is-visible { opacity: 1; pointer-events: auto; }
    .scroll-hint span { display: inline-block; animation: bob 1.6s ease-in-out infinite; }

    /* アニメーション（①0.3s後から2.5秒 → ②2.8s後から0.9秒） */
    .is-loaded .title-vertical   { animation: fadeIn 2.5s ease-out 0.3s forwards; }
    .is-loaded .title-horizontal { animation: slideInFromLeft 0.9s cubic-bezier(0.22, 1, 0.36, 1) 2.8s forwards; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideInFromLeft {
      from { opacity: 0; transform: translateX(-150%); }  /* 画面の左外から（上下は動かない） */
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }

    /* ==================================================
       2. カテゴリ別カルーセル
    ================================================== */
    .categories {
      padding: clamp(3rem, 8vw, 6rem) 0 clamp(3rem, 8vw, 6rem);
    }

    .category { margin-bottom: clamp(2.5rem, 6vw, 4.5rem); }
    .category:last-child { margin-bottom: 0; }

    .category__head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      padding: 0 clamp(1rem, 4vw, 3rem);
      margin-bottom: 1rem;
    }
    .category__title {
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 400;
      letter-spacing: 0.12em;
      padding-left: 0.8rem;
      border-left: 3px solid var(--sakura);
    }
    .all-btn {
      background: none;
      border: 0;
      color: var(--sakura);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      cursor: pointer;
      white-space: nowrap;
      padding: 0.3rem 0;
      border-bottom: 1px solid transparent;
    }
    .all-btn:hover, .all-btn:focus-visible { border-bottom-color: var(--sakura); outline: none; }

    .carousel { position: relative; overflow: hidden; }

    /* 表示窓（横ドラッグは自前処理、縦スクロールはブラウザに任せる） */
    .carousel__viewport {
      overflow: hidden;
      touch-action: pan-y;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    .carousel__viewport.is-dragging { cursor: grabbing; }

    /* カードの並び（JavaScriptが transform で動かします） */
    .carousel__track {
      display: flex;
      gap: var(--gap);
      width: max-content;
      /* 左の余白は、中央のカードが真ん中に来るようJavaScriptが自動で設定します */
      will-change: transform;
    }

    /* カード（ボックス） */
    .card {
      position: relative;
      flex: 0 0 var(--card-w);
      aspect-ratio: 4 / 3;          /* 16 / 9 に変えるとより横長になります */
      border: 1px solid var(--card-border);
      border-radius: 6px;
      overflow: hidden;
      background: #333;
    }
    .card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }
    .card__name {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1rem;
      color: #fff;
      font-weight: 300;
      font-size: clamp(1.3rem, 2.6vw, 1.8rem);
      letter-spacing: 0.12em;
      text-shadow: 0 0 4px #000, 2px 2px 3px #000, -2px 2px 3px #000, 0 3px 10px rgba(0, 0, 0, 0.9);
      background: linear-gradient(rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12));
    }

    /* 左右ボタン */
    .carousel__btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      width: 2.8rem;
      height: 2.8rem;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-family: inherit;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .carousel__btn:hover, .carousel__btn:focus-visible { background: rgba(232, 166, 182, 0.85); outline: none; }
    .carousel__btn:disabled, .carousel__btn:disabled:hover { opacity: 0.3; cursor: default; background: rgba(0, 0, 0, 0.55); }
    .carousel__btn--prev { left: clamp(0.4rem, 1.5vw, 1.2rem); }
    .carousel__btn--next { right: clamp(0.4rem, 1.5vw, 1.2rem); }

    /* ==================================================
       3. 「すべて表示」モーダル
    ================================================== */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.75);
    }
    .modal.is-open { display: flex; }
    .modal__panel {
      width: min(960px, 100%);
      max-height: 88vh;
      overflow-y: auto;
      background: var(--ink-soft);
      border-radius: 10px;
      padding: clamp(1.2rem, 3vw, 2rem);
    }
    .modal__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.2rem;
    }
    .modal__title {
      font-size: clamp(1.3rem, 3vw, 1.8rem);
      font-weight: 400;
      letter-spacing: 0.12em;
      padding-left: 0.8rem;
      border-left: 3px solid var(--sakura);
    }
    .modal__close {
      background: none;
      border: 1px solid var(--line);
      border-radius: 50%;
      width: 2.4rem;
      height: 2.4rem;
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
    }
    .modal__close:hover, .modal__close:focus-visible { background: rgba(128, 128, 128, 0.25); outline: none; }
    .modal__grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.8rem;
    }
    .modal__grid .card { flex: none; }

    /* ==================================================
       4. 校内マップ（階層選択）
    ================================================== */
    .map {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 var(--pad) clamp(3rem, 8vw, 6rem);
    }
    .map__tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1.2rem 0 1rem; }
    .map__tab {
      font-family: inherit;
      font-size: 1rem;
      letter-spacing: 0.1em;
      padding: 0.5rem 1.4rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: none;
      color: var(--text);
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s, color 0.2s;
    }
    .map__tab:hover, .map__tab:focus-visible { border-color: var(--sakura); outline: none; }
    .map__tab[aria-selected="true"] { background: var(--sakura); border-color: var(--sakura); color: var(--ink); }
    /* マップのスライダー */
    .map__slider {
      position: relative;
      aspect-ratio: 16 / 10;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      overflow: hidden;
      background: var(--ink-soft);
    }
    .map__viewport { height: 100%; overflow: hidden; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; }
    .map__track { display: flex; height: 100%; transition: transform 0.25s ease-out; will-change: transform; }
    .map__track.is-dragging { transition: none; cursor: grabbing; }
    .map__slide { flex: 0 0 100%; height: 100%; }
    .map__slide img { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    /* いま表示中の階（左上のバッジ） */
    .map__badge {
      position: absolute;
      top: 0.8rem;
      left: 0.8rem;
      z-index: 2;
      padding: 0.2rem 0.9rem;
      border-radius: 999px;
      background: var(--sakura);
      color: var(--ink);
      font-size: 1.1rem;
      letter-spacing: 0.1em;
    }

    /* スマホ表示（JS側の MOBILE_MAX_WIDTH と同じ値にしてください） */
    /* ==================================================
       団体の詳細ポップアップ
    ================================================== */
    .card { cursor: pointer; }
    .carousel__viewport .card { cursor: inherit; }   /* カルーセル内はドラッグ用の手のカーソル */
    .modal--detail { z-index: 110; }                  /* 一覧モーダルより手前に出す */
    .detail__panel { width: min(760px, 100%); }
    .detail__sub {
      margin: -0.4rem 0 0 calc(3px + 0.8rem);
      color: var(--sakura);
      font-size: 1rem;
      letter-spacing: 0.06em;
      line-height: 1.6;
    }
    .detail__text {
      margin-top: 1.4rem;
      font-size: 1.05rem;
      line-height: 2;
      letter-spacing: 0.04em;
      font-weight: 400;
    }
    .detail__img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      max-height: 70vh;
      margin-top: 1.6rem;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      object-fit: cover;
      background: #333;
    }

    @media (max-width: 767px) {
      :root { --gap: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .is-loaded .title-vertical, .is-loaded .title-horizontal { animation-duration: 0.01s; animation-delay: 0s; }
      .scroll-hint span { animation: none; }
    }

    @media (max-width: 600px) {
      .title-horizontal { left: 1rem; bottom: 1rem; }
      .scroll-hint { bottom: 1rem; }
      .carousel__btn { width: 2.3rem; height: 2.3rem; }
    }
  </style>
</head>
<body>

  <!-- ==================================================
       1. ヒーロー（ファーストビュー）
  ================================================== -->
  <section class="hero" id="hero">

    <!-- ▼▼▼ 背景画像 ▼▼▼
         images/hero.jpg（または .png / .webp）を置くと自動で表示されます。
         画像が無いときは仮画像（Unsplash）が表示されます。
         ※src と alt は下の <script> が自動で設定します -->
    <img class="hero__bg" id="heroImg" alt="">
    <!-- ▲▲▲ 背景画像ここまで ▲▲▲ -->

    <div class="hero__content">
      <div>
        <!-- ① 縦書きメインタイトル（縦書きでは「ー」が縦線として表示されます） -->
        <h1 class="title-vertical">
          <span class="title-vertical__main">伝承華</span>
          <span class="title-vertical__sub">ー受け継ぐ想い、咲き誇る今ー</span>
        </h1>
      </div>
    </div>

    <!-- ② 横書きサブタイトル（画面左下） -->
    <p class="title-horizontal" id="subtitle">第64回<br>文化祭</p>

    <!-- スクロール案内（サブタイトル表示完了後に出現） -->
    <button class="scroll-hint" id="scrollHint" type="button">Scroll <span>↓</span></button>
  </section>

  <!-- ==================================================
       2. カテゴリ別カルーセル
       ※ここは下の <script> 内の「CATEGORIES」から自動生成されます。
         団体の追加・画像差し替え・カテゴリ追加はすべて CATEGORIES を編集してください。
  ================================================== -->
  <main class="categories" id="categories"></main>

  <!-- ==================================================
       校内マップ（階層選択）
       ※タブと画像は下の <script> 内の「FLOORS」から自動生成されます。
  ================================================== -->
  <section class="map" id="map">
    <h2 class="category__title">校内マップ</h2>
    <div class="map__tabs" id="mapTabs" role="tablist" aria-label="階を選択"></div>
    <!-- 左右の矢印・スワイプ・ドラッグで階を切り替え。画像の差し替えは下の <script> の FLOORS で -->
    <div class="map__slider" role="tabpanel">
      <span class="map__badge" id="mapBadge">1F</span>
      <button class="carousel__btn carousel__btn--prev" id="mapPrev" type="button" aria-label="前の階">＜</button>
      <div class="map__viewport" id="mapViewport"><div class="map__track" id="mapTrack"></div></div>
      <button class="carousel__btn carousel__btn--next" id="mapNext" type="button" aria-label="次の階">＞</button>
    </div>
  </section>

  <!-- ==================================================
       3. 「すべて表示」モーダル（中身はJavaScriptで入れ替わります）
  ================================================== -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal__panel">
      <div class="modal__head">
        <h2 class="modal__title" id="modalTitle"></h2>
        <button class="modal__close" id="modalClose" type="button" aria-label="閉じる">✕</button>
      </div>
      <div class="modal__grid" id="modalGrid"></div>
    </div>
  </div>

  <!-- ==================================================
       4. 団体の詳細ポップアップ（カードをクリックすると開きます）
          並び順：団体名 → 企画名 → 紹介文 → 画像（画像は紹介文の下）
          ※中身はJavaScriptが入れます。順番を変えたいときはこの中の並びを入れ替えてください
  ================================================== -->
  <div class="modal modal--detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <div class="modal__panel detail__panel">
      <div class="modal__head">
        <h2 class="modal__title" id="detailTitle"></h2>
        <button class="modal__close" id="detailClose" type="button" aria-label="閉じる">✕</button>
      </div>
      <p class="detail__sub" id="detailSub"></p>
      <p class="detail__text" id="detailText"></p>
      <img class="detail__img" id="detailImg" alt="">
    </div>
  </div>

  <script>
    /* ==================================================
       ★★★ データ設定（ここを編集すると表示内容が変わります） ★★★

       ■ 画像の差し替え（かんたん）：
           images/カテゴリid/file名.jpg  というファイルを置くだけで自動表示されます。
           例）食バザーの2年2組 → images/food/2-2.jpg
           （.jpg .jpeg .png .webp に対応／見つからなければ仮画像）
         ※img にURLを書くと、そちらが優先されます。 例）img: "https://…/photo.jpg"
         ※この画像は、カードの背景と、詳細ポップアップの下部（紹介文の下）に使われます。
       ■ 各団体のデータの意味：
           name  = カードに表示する団体名
           file  = 画像のファイル名（半角英数。images/カテゴリid/file.jpg）
           title = 企画名（詳細ポップアップの見出し下に表示。不要なら "" ）
           text  = 紹介文（詳細ポップアップの中ほどに表示）
           img   = 画像URLを直接指定したいときだけ（通常は "" のまま）
       ■ 団体の追加：items の中に { name: "団体名", file: "半角英数", title: "企画名", text: "紹介文", img: "" } を1行足す
       ■ カテゴリ（5つ目以降）の追加：下の配列の最後に

      return `<figure class="card" data-i="${index}"${isClone ? ' aria-hidden="true"' : ''}>
        <img src="${src}" alt="" draggable="false" loading="lazy">
        <figcaption class="card__name">${item.name}</figcaption>
      </figure>`;
    }

    // ---------- 画像の自動検出（images フォルダにある画像を探す） ----------
    // 画像が読み込めるか確認（3秒で打ち切り）
    function probeImage(src) {
      return new Promise((resolve) => {
        const img = new Image();
        const timer = setTimeout(() => resolve(false), 3000);
        img.onload = () => { clearTimeout(timer); resolve(true); };
        img.onerror = () => { clearTimeout(timer); resolve(false); };
        img.src = src;
      });
    }
    // images/フォルダ/ファイル名.拡張子 を順に探す。見つからなければ ""
    async function findImage(folder, file) {
      for (const ext of IMAGE_EXTENSIONS) {
        const src = [IMAGE_FOLDER, folder, encodeURIComponent(file)].filter(Boolean).join("/") + "." + ext;
        if (await probeImage(src)) return src;
      }
      return "";
    }
    // 団体・マップの画像を決める：img指定 → imagesフォルダ → 仮画像 の順
    async function resolveItems() {
      const jobs = [];
      CATEGORIES.forEach((cat) => cat.items.forEach((item) => {
        jobs.push((async () => {
          item.src = item.img || (item.file ? await findImage(cat.id, item.file) : "") || dummyImg(cat.id + "-" + item.name);
        })());
      }));
      FLOORS.forEach((f) => {
        jobs.push((async () => {
          f.src = f.img || (f.file ? await findImage("map", f.file) : "") || mapPlaceholder(f.label);
        })());
      });
      await Promise.all(jobs);
    }
    // ヒーロー（背景）画像を決める：HERO_IMAGE → images/hero.* → 仮画像
    async function resolveHero() {
      return HERO_IMAGE || (await findImage("", "hero")) || HERO_FALLBACK;
    }

    // ---------- カテゴリセクションの生成 ----------
    const root = document.getElementById("categories");

    function buildCategories() {
    CATEGORIES.forEach((cat) => {
      const sec = document.createElement("section");
      sec.className = "category";
      sec.id = "cat-" + cat.id;
      sec.innerHTML = `
        <div class="category__head">
          <h2 class="category__title">${cat.title}</h2>
          <button class="all-btn" type="button">＜すべて表示＞</button>
        </div>
        <div class="carousel">
          <button class="carousel__btn carousel__btn--prev" type="button" aria-label="前へ">＜</button>
          <div class="carousel__viewport"><div class="carousel__track"></div></div>
          <button class="carousel__btn carousel__btn--next" type="button" aria-label="次へ">＞</button>
        </div>`;
      root.appendChild(sec);

      setupCarousel(sec.querySelector(".carousel"), cat);
      sec.querySelector(".all-btn").addEventListener("click", () => openModal(cat));
    });
    }

    // ---------- 無限ループ・カルーセルの動作 ----------
    // 仕組み：団体カードを前後に複製（クローン）して並べ、
    //         位置が1セット分ずれたら見た目が変わらないまま元の位置へ戻す → 途切れずに回り続けます。
    function setupCarousel(carousel, cat) {
      const viewport = carousel.querySelector(".carousel__viewport");
      const track = carousel.querySelector(".carousel__track");
      const prev = carousel.querySelector(".carousel__btn--prev");
      const next = carousel.querySelector(".carousel__btn--next");
      const n = cat.items.length;
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

      let step = 0;   // カード1枚ぶんの移動量（カード幅＋すき間）
      let setW = 0;   // 団体カード1セットぶんの幅
      let base = 0;   // 本物（中央セット）の先頭位置
      let pos = 0;    // 現在のスクロール位置(px)
      let tween = null, raf = 0;

      const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
      const easeOut = (t) => 1 - Math.pow(1 - t, 3);
      const setHTML = (isClone) => cat.items.map((it, i) => cardHTML(it, cat, isClone, i)).join("");
      const render = () => { track.style.transform = `translate3d(${-pos}px,0,0)`; };
      const snap = (p) => base + Math.round((p - base) / step) * step;

      // カードを並べ直す（最初と画面サイズ変更時）。index=先頭に表示する団体の番号
      function build(index) {
        const V = carousel.clientWidth;                          // カルーセルの表示幅
        const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
        // 端のカードが EDGE_VISIBLE だけ見える大きさを逆算（PC=横5枚 / スマホ=横3枚）
        const mobile = window.innerWidth <= MOBILE_MAX_WIDTH;
        const cardW = mobile
          ? (V / 2 - gap) / (0.5 + EDGE_VISIBLE)
          : (V / 2 - 2 * gap) / (1.5 + EDGE_VISIBLE);
        carousel.style.setProperty("--card-w", cardW + "px");
        track.style.marginLeft = (V - cardW) / 2 + "px";         // 中央のカードを画面の真ん中へ
        step = cardW + gap;
        setW = step * n;
        const copies = Math.ceil(V / setW) + 1;                  // 左右に必要なクローン数
        let html = "";
        for (let i = 0; i < copies * 2 + 1; i++) html += setHTML(i !== copies);
        track.innerHTML = html;
        base = copies * setW;
        pos = base + index * step;
        tween = null;
        render();
      }

      // 位置が中央セットの外に出たら、1セットぶん戻す（見た目は変わらない）。戻した量を返す
      function wrap() {
        let d = 0;
        while (pos >= base + setW) { pos -= setW; d -= setW; }
        while (pos < base) { pos += setW; d += setW; }
        if (d && tween) { tween.from += d; tween.to += d; }
        return d;
      }

      // なめらかに target 位置まで動かす
      function animateTo(target, dur, ease) {
        tween = { from: pos, to: target, t0: performance.now(), dur: reduceMotion ? 1 : dur, ease };
        if (!raf) raf = requestAnimationFrame(tick);
      }
      function tick(now) {
        raf = 0;
        if (!tween) return;
        const t = Math.min(1, Math.max(0, (now - tween.t0) / tween.dur));
        pos = tween.from + (tween.to - tween.from) * tween.ease(t);
        wrap();
        render();
        if (t < 1) raf = requestAnimationFrame(tick); else tween = null;
      }

      // dir: 1=次へ / -1=前へ（常に1枚ずつ）
      function slideBy(dir, dur = SLIDE_MS, ease = easeInOut) {
        const cur = tween ? tween.to : snap(pos);
        animateTo(cur + dir * step, dur, ease);
      }

      // ボタン操作：素早くスッと動かし、自動再生のタイマーをリセット
      prev.addEventListener("click", () => { slideBy(-1, BUTTON_SLIDE_MS, easeOut); start(); });
      next.addEventListener("click", () => { slideBy(1, BUTTON_SLIDE_MS, easeOut); start(); });

      // オートスライド（マウスを乗せている間・ドラッグ中は停止）
      let timer = null, hovering = false, dragging = false;
      const stop = () => { clearInterval(timer); timer = null; };
      const start = () => {
        stop();
        if (!hovering) timer = setInterval(() => { if (!dragging && !document.hidden) slideBy(1); }, AUTO_SLIDE_MS);
      };
      carousel.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") { hovering = true; stop(); } });
      carousel.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") { hovering = false; start(); } });

      // マウスドラッグ／タッチスワイプ（Pointer Events で共通処理）
      let startX = 0, startPos = 0, lastX = 0, lastT = 0, vel = 0, moved = false;
      viewport.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        dragging = true;
        tween = null;
        startX = lastX = e.clientX;
        startPos = pos;
        lastT = performance.now();
        vel = 0;
        moved = false;
        viewport.setPointerCapture(e.pointerId);
        viewport.classList.add("is-dragging");
        stop();
      });
      viewport.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        if (Math.abs(e.clientX - startX) > 6) moved = true;   // 6px以上動いたらタップではなくドラッグ
        const now = performance.now();
        const dt = now - lastT;
        if (dt > 0) vel = vel * 0.6 + ((lastX - e.clientX) / dt) * 0.4;   // 指/マウスの勢い(px/ms)
        lastX = e.clientX;
        lastT = now;
        pos = startPos - (e.clientX - startX);
        startPos += wrap();
        render();
      });
      const endDrag = (e) => {
        if (!dragging) return;
        dragging = false;
        viewport.classList.remove("is-dragging");
        const isTap = !moved && e.type === "pointerup";
        // ドラッグなら勢いを加味して近いカードに揃える／タップならその場に留める
        animateTo(snap(isTap ? pos : pos + vel * 200), 500, easeOut);
        start();
        if (isTap) {
          // タップ：指/マウスの下にあるカードの詳細ポップアップを開く
          const el = document.elementFromPoint(e.clientX, e.clientY);
          const card = el && el.closest(".card");
          if (card && card.dataset.i !== undefined) openDetail(cat, cat.items[Number(card.dataset.i)]);
        }
      };
      viewport.addEventListener("pointerup", endDrag);
      viewport.addEventListener("pointercancel", endDrag);

      // 画面サイズが変わったら並べ直す
      let resizeTimer = null;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          const idx = ((Math.round((pos - base) / step) % n) + n) % n;
          build(idx);
        }, 150);
      });

      build(0);
      start();
    }

    
    // ---------- ポップアップ（一覧モーダル／詳細モーダル） ----------
    const modal = document.getElementById("modal");           // 「すべて表示」の一覧
    const modalTitle = document.getElementById("modalTitle");
    const modalGrid = document.getElementById("modalGrid");
    const modalClose = document.getElementById("modalClose");
    const detail = document.getElementById("detail");         // 団体の詳細
    const detailTitle = document.getElementById("detailTitle");
    const detailSub = document.getElementById("detailSub");
    const detailText = document.getElementById("detailText");
    const detailImg = document.getElementById("detailImg");
    const detailClose = document.getElementById("detailClose");
    let modalFocus = null, detailFocus = null, modalCat = null;

    // どれかのポップアップが開いている間は、背景をスクロールさせない
    function updateScrollLock() {
      const anyOpen = modal.classList.contains("is-open") || detail.classList.contains("is-open");
      document.documentElement.classList.toggle("modal-open", anyOpen);
    }

    // 一覧モーダル（その部門の全団体をグリッド表示）
    function openModal(cat) {
      modalFocus = document.activeElement;
      modalCat = cat;
      modalTitle.textContent = cat.title;
      modalGrid.innerHTML = cat.items.map((it, i) => cardHTML(it, cat, false, i)).join("");
      modalGrid.querySelectorAll(".card").forEach((c) => { c.setAttribute("role", "button"); c.tabIndex = 0; });
      modal.classList.add("is-open");
      updateScrollLock();
      modalClose.focus();
    }
    function closeModal() {
      modal.classList.remove("is-open");
      updateScrollLock();
      if (modalFocus) modalFocus.focus();
    }

    // 詳細モーダル：上＝団体名（＋企画名）／中＝紹介文／下＝画像 の順
    function openDetail(cat, item) {
      detailFocus = document.activeElement;
      detailTitle.textContent = item.name;
      detailSub.textContent = item.title || "";
      detailSub.hidden = !item.title;
      detailText.textContent = item.text || "";
      detailImg.src = item.src || item.img || dummyImg(cat.id + "-" + item.name);
      detailImg.alt = item.name + "の画像";
      detail.classList.add("is-open");
      detail.querySelector(".modal__panel").scrollTop = 0;
      updateScrollLock();
      detailClose.focus();
    }
    function closeDetail() {
      detail.classList.remove("is-open");
      updateScrollLock();
      if (detailFocus) detailFocus.focus();
    }

    modalClose.addEventListener("click", closeModal);
    detailClose.addEventListener("click", closeDetail);
    modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });     // 背景クリックで閉じる
    detail.addEventListener("click", (e) => { if (e.target === detail) closeDetail(); });

    // 一覧の中のカードをクリック（またはEnter）→ 詳細モーダル
    modalGrid.addEventListener("click", (e) => {
      const card = e.target.closest(".card");
      if (card && modalCat) openDetail(modalCat, modalCat.items[Number(card.dataset.i)]);
    });
    modalGrid.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const card = e.target.closest(".card");
      if (card && modalCat) { e.preventDefault(); openDetail(modalCat, modalCat.items[Number(card.dataset.i)]); }
    });

    // Escキー：いちばん手前のポップアップから閉じる
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      if (detail.classList.contains("is-open")) closeDetail();
      else if (modal.classList.contains("is-open")) closeModal();
    });

    // ---------- 校内マップ（スライダー） ----------
    // 仮のマップ画像（img が空のときに使うSVG）
    function mapPlaceholder(label) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
        <rect width="800" height="500" fill="#e9e4ea"/>
        <g fill="none" stroke="#9a93a0" stroke-width="3">
          <rect x="40" y="40" width="720" height="420"/>
          <path d="M40 200H760M300 40V200M520 40V200M200 200V460M600 200V460"/>
        </g>
        <text x="400" y="340" text-anchor="middle" font-size="40" fill="#6d6673" font-family="serif">${label} マップ（仮）</text>
      </svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    const mapTabs = document.getElementById("mapTabs");
    const mapTrack = document.getElementById("mapTrack");
    const mapViewport = document.getElementById("mapViewport");
    const mapPrev = document.getElementById("mapPrev");
    const mapNext = document.getElementById("mapNext");
    const mapBadge = document.getElementById("mapBadge");
    let floorIdx = 0;

    // 階のインジケーター（1F 2F 3F 4F）
    const tabButtons = FLOORS.map((floor, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "map__tab";
      b.setAttribute("role", "tab");
      b.textContent = floor.tag || floor.label;
      b.addEventListener("click", () => goFloor(i));
      mapTabs.appendChild(b);
      return b;
    });

    function renderMap() {
      mapTrack.style.transform = `translateX(${-floorIdx * 100}%)`;
      tabButtons.forEach((b, j) => b.setAttribute("aria-selected", String(j === floorIdx)));
      mapPrev.disabled = floorIdx === 0;
      mapNext.disabled = floorIdx === FLOORS.length - 1;
      mapBadge.textContent = FLOORS[floorIdx].tag || FLOORS[floorIdx].label;
    }
    function goFloor(i) {
      floorIdx = Math.max(0, Math.min(FLOORS.length - 1, i));
      renderMap();
    }
    function buildMap() {
      mapTrack.innerHTML = FLOORS.map((f) =>
        `<div class="map__slide"><img src="${f.src || f.img || mapPlaceholder(f.label)}" alt="${f.label}の校内マップ" draggable="false"></div>`
      ).join("");
      renderMap();
    }

    mapPrev.addEventListener("click", () => goFloor(floorIdx - 1));
    mapNext.addEventListener("click", () => goFloor(floorIdx + 1));
    // ←→キーでも切り替え
    mapTabs.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      goFloor(floorIdx + (e.key === "ArrowRight" ? 1 : -1));
      tabButtons[floorIdx].focus();
    });

    // スワイプ／ドラッグ（指でもマウスでも）
    let mDrag = false, mStartX = 0, mDx = 0;
    mapViewport.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      mDrag = true;
      mStartX = e.clientX;
      mDx = 0;
      mapViewport.setPointerCapture(e.pointerId);
      mapTrack.classList.add("is-dragging");
    });
    mapViewport.addEventListener("pointermove", (e) => {
      if (!mDrag) return;
      mDx = e.clientX - mStartX;
      let dx = mDx;
      if ((floorIdx === 0 && dx > 0) || (floorIdx === FLOORS.length - 1 && dx < 0)) dx *= 0.3; // 端では重く
      mapTrack.style.transform = `translateX(${-floorIdx * mapViewport.clientWidth + dx}px)`;
    });
    function mapEndDrag() {
      if (!mDrag) return;
      mDrag = false;
      mapTrack.classList.remove("is-dragging");
      const threshold = Math.min(mapViewport.clientWidth * 0.2, 60);
      if (mDx < -threshold) goFloor(floorIdx + 1);
      else if (mDx > threshold) goFloor(floorIdx - 1);
      else renderMap();
    }
    mapViewport.addEventListener("pointerup", mapEndDrag);
    mapViewport.addEventListener("pointercancel", mapEndDrag);

    // ---------- ヒーロー画像の見せる位置（横長画面で顔が映るように） ----------
    // 画面の縦横比に合わせて、HERO_FOCUS_Y の高さが画面の中心に来るよう object-position を計算します
    function updateHeroFocus() {
      const img = document.getElementById("heroImg");
      const cw = window.innerWidth, ch = window.innerHeight;
      if (!img.naturalWidth) return;
      if (cw < ch) { img.style.objectPosition = "center"; return; }      // 縦長画面は中央
      const scaledH = img.naturalHeight * Math.max(cw / img.naturalWidth, ch / img.naturalHeight);
      const visible = ch / scaledH;                                      // 画像のうち縦に何割が映るか
      if (visible >= 1) { img.style.objectPosition = "center"; return; }
      const p = Math.min(1, Math.max(0, (HERO_FOCUS_Y - visible / 2) / (1 - visible)));
      img.style.objectPosition = "center " + (p * 100).toFixed(1) + "%";
    }
    window.addEventListener("resize", updateHeroFocus);

    // ---------- 画像の準備 → 表示の組み立て ----------
    // ① ヒーロー画像を先に読み込み、完了してから文字の演出を開始（文字だけ先に動かない）
    resolveHero().then((heroSrc) => {
      const heroImg = document.getElementById("heroImg");
      let usedFallback = false;
      heroImg.onload = () => { updateHeroFocus(); startHeroAnimation(); };
      heroImg.onerror = () => {
        if (!usedFallback) { usedFallback = true; heroImg.src = HERO_FALLBACK; }  // 失敗したら仮画像で再挑戦
        else startHeroAnimation();                                                 // それでも駄目でも演出は始める
      };
      heroImg.alt = "文化祭メイン画像";
      heroImg.src = heroSrc;
      if (heroImg.complete && heroImg.naturalWidth) { updateHeroFocus(); startHeroAnimation(); } // キャッシュ済みの場合
    });
    setTimeout(() => startHeroAnimation(), 8000);   // 通信が極端に遅くても、8秒後には演出を始める保険

    // ② 団体・マップの画像を確認してから、カードとマップを表示
    resolveItems().then(() => {
      buildCategories();
      buildMap();
    });

    // ---------- ダーク／ライトモード（OS設定に自動追従） ----------
    // ページを開いたままOSのテーマを変えても、リロードなしで即座に切り替わります。
    const colorQuery = window.matchMedia("(prefers-color-scheme: dark)");
    function applyTheme(isDark) {
      document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
    }
    applyTheme(colorQuery.matches);
    if (colorQuery.addEventListener) {
      colorQuery.addEventListener("change", (e) => applyTheme(e.matches));
    } else {
      colorQuery.addListener((e) => applyTheme(e.matches)); // 古いSafari向け
    }

    // ---------- ヒーロー演出＆スクロールロック解除 ----------
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    window.scrollTo(0, 0);

    const hero = document.getElementById("hero");
    const subtitle = document.getElementById("subtitle");
    const hint = document.getElementById("scrollHint");
    let unlocked = false;

    function unlockScroll() {
      if (unlocked) return;
      unlocked = true;
      document.documentElement.classList.remove("is-locked"); // スクロール解禁
      hint.classList.add("is-visible");                       // 「Scroll ↓」表示
    }

    // 背景画像の読み込みが終わってから呼ばれる（何度呼ばれても1回だけ実行）
    let heroStarted = false;
    function startHeroAnimation() {
      if (heroStarted) return;
      heroStarted = true;
      hero.classList.add("is-loaded");
      // サブタイトルのアニメーション終了でスクロール解禁（念のため保険タイマーも設定）
      subtitle.addEventListener("animationend", unlockScroll);
      setTimeout(unlockScroll, 4500);
    }

    hint.addEventListener("click", () => {
      document.getElementById("categories").scrollIntoView({ behavior: "smooth" });
    });
  </script>
</body>
</html>
